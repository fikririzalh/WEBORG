<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Prism Dice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============ TOKENS ============ */
  :root{
    --c-sky:#3CB4E6; --c-emerald:#32B18E; --c-pink:#F05696; --c-orange:#FF8040;
    --c-yellow:#FFD730; --c-magenta:#9C208C; --c-bronze:#B89C57; --c-silver:#959595;
    --c-navy:#001F4F; --c-white:#F0F0F0; --c-grey:#D0D0D0;

    --bg-a:#FBFBF9; --bg-b:#F0F0F0;
    --surface:#FFFFFF; --surface-2:#F6F6F4;
    --border:#D8D8D4;
    --text:#001F4F; --text-muted:#5A6270;
    --shadow: rgba(0,31,79,0.14);
    --shadow-lg: rgba(0,31,79,0.20);

    --font-display:'Fredoka','Baloo 2',system-ui,sans-serif;
    --font-body:'Nunito','Segoe UI',system-ui,sans-serif;

    --radius-sm:10px; --radius-md:16px; --radius-lg:26px; --radius-pill:999px;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg-a:#001126; --bg-b:#001F4F;
      --surface:#0C2C5C; --surface-2:#0A2450;
      --border: rgba(240,240,240,0.16);
      --text:#F4F5F7; --text-muted:#AEB8CC;
      --shadow: rgba(0,0,0,0.45);
      --shadow-lg: rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --bg-a:#001126; --bg-b:#001F4F;
    --surface:#0C2C5C; --surface-2:#0A2450;
    --border: rgba(240,240,240,0.16);
    --text:#F4F5F7; --text-muted:#AEB8CC;
    --shadow: rgba(0,0,0,0.45);
    --shadow-lg: rgba(0,0,0,0.55);
  }
  :root[data-theme="light"]{
    --bg-a:#FBFBF9; --bg-b:#F0F0F0;
    --surface:#FFFFFF; --surface-2:#F6F6F4;
    --border:#D8D8D4;
    --text:#001F4F; --text-muted:#5A6270;
    --shadow: rgba(0,31,79,0.14);
    --shadow-lg: rgba(0,31,79,0.20);
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; min-height:100vh; color:var(--text); font-family:var(--font-body);
    background: linear-gradient(160deg, var(--bg-a), var(--bg-b));
    background-attachment:fixed;
    transition: background 0.3s ease, color 0.3s ease;
  }
  img{ max-width:100%; }
  button, select, input{ font-family:inherit; color:inherit; }
  button{ cursor:pointer; }
  .wide-scroll{ overflow-x:auto; }

  *:focus-visible{ outline:3px solid var(--c-sky); outline-offset:2px; border-radius:6px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  /* ============ LAYOUT SHELL ============ */
  .app{ max-width:1080px; margin:0 auto; padding: var(--sp-5) var(--sp-4) var(--sp-7); }

  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3); margin-bottom:var(--sp-6); animation: fadeDown 0.5s ease both; }
  .brand{ display:flex; align-items:center; gap:var(--sp-2); }
  .brand-mark{
    display:inline-flex; align-items:center; justify-content:center;
    width:38px; height:38px; border-radius:12px; font-size:1.1rem;
    background: linear-gradient(135deg, var(--c-sky), var(--c-pink));
    box-shadow: 0 6px 14px var(--shadow);
    transform: rotate(-8deg);
  }
  .brand h1{ font-family:var(--font-display); font-weight:600; font-size:1.4rem; margin:0; letter-spacing:0.2px; }
  .brand h1 span{ color: var(--c-pink); }
  .header-actions{ display:flex; gap:var(--sp-2); }
  .icon-btn{
    width:40px; height:40px; border-radius:var(--radius-pill); border:1px solid var(--border);
    background:var(--surface); font-size:1.05rem; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 6px var(--shadow); transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .icon-btn:hover{ transform:translateY(-2px); box-shadow:0 6px 14px var(--shadow); }
  .icon-btn:active{ transform:translateY(0); }

  /* ============ HERO ============ */
  .hero{ display:flex; flex-direction:column; align-items:center; gap:var(--sp-3); text-align:center; margin-bottom:var(--sp-6); animation: fadeUp 0.6s ease both 0.05s; }
  .hero p.tag{ margin:0; color:var(--text-muted); font-size:0.98rem; max-width:46ch; }

  .roll-all-btn{
    position:relative; border:none; border-radius:var(--radius-pill);
    padding: 22px 56px; font-family:var(--font-display); font-weight:600;
    font-size:clamp(1.25rem, 2.6vw, 1.7rem); color:#fff;
    background: linear-gradient(120deg, var(--c-sky), var(--c-emerald), var(--c-yellow), var(--c-orange), var(--c-pink), var(--c-magenta));
    background-size:280% 280%;
    animation: prismShift 7s ease infinite;
    box-shadow: 0 14px 30px var(--shadow-lg);
    text-shadow: 0 2px 8px rgba(0,31,79,0.55);
    display:flex; align-items:center; gap:var(--sp-3);
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
  }
  .roll-all-btn .roll-icon{ font-size:1.4em; display:inline-block; }
  .roll-all-btn:hover{ transform:translateY(-3px); box-shadow:0 18px 36px var(--shadow-lg); }
  .roll-all-btn:active{ transform:translateY(0) scale(0.97); }
  .roll-all-btn:disabled{ opacity:0.45; cursor:not-allowed; transform:none; animation-play-state:paused; }
  .roll-all-btn.is-rolling .roll-icon{ animation: iconSpin 0.5s linear infinite; }

  .hero-stats{ display:flex; gap:var(--sp-4); font-size:0.92rem; color:var(--text-muted); font-weight:700; }
  .hero-stats span b{ color:var(--text); font-weight:800; }

  /* ============ TOOLBAR ============ */
  .toolbar{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:var(--sp-3);
    margin-bottom:var(--sp-4);
  }
  .toolbar-group{ display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap; }
  .btn{
    border-radius:var(--radius-pill); border:1px solid transparent; padding:10px 18px;
    font-weight:800; font-size:0.9rem; display:inline-flex; align-items:center; gap:6px;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, opacity 0.15s ease;
  }
  .btn:active{ transform:scale(0.96); }
  .btn-add{ background:var(--c-emerald); color:#fff; box-shadow:0 6px 14px var(--shadow); }
  .btn-add:hover{ box-shadow:0 10px 20px var(--shadow); transform:translateY(-1px); }
  .btn-ghost{ background:transparent; border-color:var(--border); color:var(--text-muted); }
  .btn-ghost:hover{ color:var(--text); border-color:var(--c-sky); }
  .btn-reroll{ background:var(--c-magenta); color:#fff; box-shadow:0 6px 14px var(--shadow); }
  .btn-reroll:hover{ transform:translateY(-1px); box-shadow:0 10px 20px var(--shadow); }
  .btn-reroll:disabled{ opacity:0.4; cursor:not-allowed; transform:none; box-shadow:none; }
  .selection-count{ font-size:0.85rem; color:var(--text-muted); font-weight:700; padding:0 4px; }

  /* ============ ADD PANEL ============ */
  .add-panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:var(--sp-4) var(--sp-5); margin-bottom:var(--sp-5);
    box-shadow:0 10px 24px var(--shadow);
    animation: fadeUp 0.25s ease both;
  }
  .add-panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--sp-3); }
  .add-panel-head h2{ font-family:var(--font-display); font-size:1.05rem; margin:0; font-weight:600; }
  .add-panel-body{ display:flex; flex-wrap:wrap; gap:var(--sp-5); align-items:flex-start; }
  .field-label{ display:block; font-size:0.78rem; font-weight:800; color:var(--text-muted); margin-bottom:var(--sp-2); text-transform:none; }
  .select-control{
    border-radius:var(--radius-sm); border:1.5px solid var(--border); background:var(--surface-2);
    padding:8px 10px; font-weight:700; font-size:0.9rem; color:var(--text);
  }
  .number-control{
    border-radius:var(--radius-sm); border:1.5px solid var(--border); background:var(--surface-2);
    padding:8px 10px; font-weight:700; font-size:0.9rem; color:var(--text); width:88px; margin-top:8px;
  }
  .swatch-row{ display:flex; flex-wrap:wrap; gap:8px; max-width:280px; }
  .swatch{
    width:30px; height:30px; border-radius:50%; border:2px solid transparent; position:relative;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
    transition: transform 0.12s ease;
  }
  .swatch:hover{ transform:scale(1.12); }
  .swatch.is-active{ border-color:var(--text); }
  .swatch.is-active::after{ content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:0.8rem; text-shadow:0 1px 2px rgba(0,0,0,0.5); }
  .swatch-prism{ background: conic-gradient(var(--c-sky), var(--c-emerald), var(--c-yellow), var(--c-orange), var(--c-pink), var(--c-magenta), var(--c-sky)); }
  .custom-color-group{ display:flex; align-items:center; gap:8px; padding-left:8px; margin-left:2px; border-left:1px dashed var(--border); }
  .swatch-custom{ position:relative; width:30px; height:30px; flex-shrink:0; display:block; cursor:pointer; }
  .color-input-native{ width:30px; height:30px; padding:0; border:2px dashed var(--text-muted); border-radius:50%; overflow:hidden; background:var(--surface-2); cursor:pointer; }
  .color-input-native::-webkit-color-swatch-wrapper{ padding:2px; }
  .color-input-native::-webkit-color-swatch{ border:none; border-radius:50%; }
  .color-input-native::-moz-color-swatch{ border:none; border-radius:50%; }
  .swatch-custom .plus-icon{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-weight:900; font-size:15px; line-height:1; color:var(--text); pointer-events:none;
    text-shadow: 0 0 3px var(--surface), 0 0 5px var(--surface), 0 0 5px var(--surface);
  }
  .hex-input{
    width:88px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface-2);
    padding:6px 8px; font-size:0.8rem; font-weight:700; color:var(--text); letter-spacing:0.3px;
  }
  .hex-input::placeholder{ color:var(--text-muted); font-weight:600; }
  .add-panel-actions{ display:flex; align-items:flex-end; height:100%; }
  .btn-add-confirm{ background:var(--c-pink); color:#fff; box-shadow:0 6px 14px var(--shadow); align-self:flex-end; margin-top:26px; }
  .btn-add-confirm:hover{ transform:translateY(-1px); box-shadow:0 10px 20px var(--shadow); }

  /* ============ DICE GRID ============ */
  .dice-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(172px, 1fr));
    gap:var(--sp-4);
  }
  .empty-state{
    grid-column:1 / -1; text-align:center; padding:var(--sp-7) var(--sp-4);
    border:2px dashed var(--border); border-radius:var(--radius-lg); color:var(--text-muted);
  }
  .empty-state .empty-emoji{ font-size:2.4rem; display:block; margin-bottom:var(--sp-2); }
  .empty-state h3{ font-family:var(--font-display); color:var(--text); margin:0 0 4px; font-weight:600; }
  .empty-state .btn{ margin-top:var(--sp-3); }

  .die-card{
    position:relative; background:var(--surface); border-radius:var(--radius-lg);
    border:2px solid var(--border); padding:var(--sp-3);
    display:flex; flex-direction:column; gap:var(--sp-3);
    box-shadow:0 8px 18px var(--shadow);
    z-index:1; animation: popIn 0.35s cubic-bezier(.2,1.4,.4,1) both;
  }
  .die-card.popover-open{ z-index:50; }
  .die-card.is-selected{ box-shadow:0 0 0 3px var(--c-sky), 0 8px 18px var(--shadow); }
  .die-card.is-new{ animation: flashHighlight 1.1s ease; }

  .die-topbar{ display:flex; align-items:center; justify-content:space-between; gap:4px; }
  .die-select{ display:flex; align-items:center; }
  .die-select input{ width:18px; height:18px; accent-color:var(--c-sky); cursor:pointer; }
  .die-type-badge{
    font-family:var(--font-display); font-weight:600; font-size:0.78rem; color:var(--text-muted);
    background:var(--surface-2); border-radius:var(--radius-pill); padding:2px 10px;
  }
  .die-icon-actions{ display:flex; gap:2px; }
  .die-mini-btn{
    width:26px; height:26px; border-radius:50%; border:none; background:transparent;
    display:flex; align-items:center; justify-content:center; font-size:0.85rem; color:var(--text-muted);
    transition:background 0.12s ease, color 0.12s ease;
  }
  .die-mini-btn:hover{ background:var(--surface-2); color:var(--text); }
  .die-mini-btn.delete:hover{ color:var(--c-pink); }
  .die-mini-btn.dup:hover{ color:var(--c-sky); }

  .die-face{
    border:none; border-radius:var(--radius-md); aspect-ratio:1/1; width:100%;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:2.1rem;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.12), 0 4px 10px var(--shadow);
    transition: box-shadow 0.2s ease;
  }
  .die-face:hover{ box-shadow: inset 0 -6px 0 rgba(0,0,0,0.12), 0 8px 16px var(--shadow-lg); }
  .die-face.is-prismatic{
    background: linear-gradient(120deg, var(--c-sky), var(--c-emerald), var(--c-yellow), var(--c-orange), var(--c-pink), var(--c-magenta));
    background-size:300% 300%; animation: prismShift 6s ease infinite;
    color:#fff; text-shadow:0 2px 6px rgba(0,31,79,0.6);
  }
  .die-face.is-rolling{ animation: dieRoll 0.4s ease-in-out infinite; }
  .die-face.is-settled{ animation: dieSettle 0.32s ease; }
  .die-face.is-crit{ box-shadow: inset 0 -6px 0 rgba(0,0,0,0.12), 0 0 0 3px var(--c-yellow), 0 4px 10px var(--shadow); }
  .die-face.is-fumble{ box-shadow: inset 0 -6px 0 rgba(0,0,0,0.12), 0 0 0 3px rgba(149,149,149,0.6), 0 4px 10px var(--shadow); opacity:0.92; }
  .die-card.is-prismatic-border{ border-image: linear-gradient(120deg,var(--c-sky),var(--c-emerald),var(--c-yellow),var(--c-orange),var(--c-pink),var(--c-magenta)) 1; }

  .die-controls{ display:flex; flex-direction:column; gap:var(--sp-2); }
  .die-field{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .die-field label{ font-size:0.72rem; font-weight:800; color:var(--text-muted); white-space:nowrap; }
  .die-sides-select{ flex:1; min-width:0; border-radius:8px; border:1.5px solid var(--border); background:var(--surface-2); padding:5px 6px; font-weight:700; font-size:0.82rem; }
  .die-sides-custom{ width:64px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface-2); padding:5px 6px; font-weight:700; font-size:0.82rem; }

  .die-color-field{ position:relative; }
  .color-swatch-toggle{
    width:100%; border-radius:8px; border:1.5px solid var(--border); background:var(--surface-2);
    padding:5px 8px; display:flex; align-items:center; gap:8px; font-weight:700; font-size:0.8rem; color:var(--text);
  }
  .color-swatch-toggle .dot{ width:16px; height:16px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12); flex-shrink:0; }
  .color-popover{
    position:absolute; top:calc(100% + 6px); left:0; width:226px; z-index:60;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:var(--sp-3); box-shadow:0 12px 28px var(--shadow-lg);
    display:flex; flex-wrap:wrap; gap:7px; align-items:center;
    animation: fadeUp 0.15s ease both;
  }
  .color-popover[hidden]{ display:none; }

  .die-reroll-btn{
    border:none; border-radius:var(--radius-pill); padding:9px 10px; font-weight:800; font-size:0.82rem;
    background:var(--surface-2); color:var(--text); border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center; gap:6px;
    transition: background 0.15s ease, transform 0.15s ease, color .15s ease, border-color .15s ease;
  }
  .die-reroll-btn:hover{ background:var(--c-sky); color:#fff; border-color:var(--c-sky); transform:translateY(-1px); }
  .die-reroll-btn:active{ transform:translateY(0) scale(0.96); }
  .die-reroll-btn .spin-ic{ display:inline-block; }
  .die-reroll-btn.is-busy .spin-ic{ animation: iconSpin 0.5s linear infinite; }

  /* ============ TOAST ============ */
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:var(--c-navy); color:#F4F5F7; padding:12px 16px; border-radius:var(--radius-pill);
    display:flex; align-items:center; gap:14px; font-weight:700; font-size:0.88rem;
    box-shadow:0 14px 30px rgba(0,0,0,0.35); opacity:0; pointer-events:none; transition:opacity 0.2s ease, transform 0.2s ease;
    z-index:200;
  }
  .toast.is-visible{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  .toast button{ background:var(--c-yellow); color:var(--c-navy); border:none; border-radius:var(--radius-pill); padding:6px 12px; font-weight:800; font-size:0.82rem; }

  /* ============ KEYFRAMES ============ */
  @keyframes fadeDown{ from{ opacity:0; transform:translateY(-10px);} to{ opacity:1; transform:translateY(0);} }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }
  @keyframes popIn{ from{ opacity:0; transform:scale(0.85);} to{ opacity:1; transform:scale(1);} }
  @keyframes prismShift{ 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
  @keyframes iconSpin{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }
  @keyframes dieRoll{ 0%{transform:rotate(0deg) scale(1);} 25%{transform:rotate(-14deg) scale(1.06);} 50%{transform:rotate(11deg) scale(0.95);} 75%{transform:rotate(-7deg) scale(1.05);} 100%{transform:rotate(0deg) scale(1);} }
  @keyframes dieSettle{ 0%{ transform:scale(1.18);} 60%{ transform:scale(0.94);} 100%{ transform:scale(1);} }
  @keyframes flashHighlight{ 0%{ box-shadow:0 0 0 4px var(--c-yellow);} 100%{ box-shadow:0 8px 18px var(--shadow);} }

  /* ============ RESPONSIVE ============ */
  @media (max-width:560px){
    .roll-all-btn{ padding:18px 30px; width:100%; justify-content:center; }
    .hero-stats{ flex-direction:row; gap:var(--sp-3); }
    .toolbar{ flex-direction:column; align-items:stretch; }
    .toolbar-group{ justify-content:space-between; }
    .add-panel-body{ flex-direction:column; gap:var(--sp-4); }
    .dice-grid{ grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); }
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <h1>Happy Prism <span>Dice</span></h1>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="soundToggle" type="button" aria-pressed="true" title="Matikan/nyalakan suara">🔊</button>
      <button class="icon-btn" id="themeToggle" type="button" title="Ganti tema terang/gelap">🌙</button>
    </div>
  </header>

  <section class="hero">
    <p class="tag">Susun kombinasi dadumu sendiri — atur jumlah sisi dan warnanya, lalu kocok semua atau sebagian saja.</p>
    <button class="roll-all-btn" id="rollAllBtn" type="button">
      <span class="roll-icon">🎲</span>
      <span>Kocok Semua</span>
    </button>
    <div class="hero-stats">
      <span id="diceCountLabel"><b>0</b> dadu</span>
      <span id="sumLabel"><b>0</b> jumlah</span>
    </div>
  </section>

  <section class="toolbar">
    <div class="toolbar-group">
      <button class="btn btn-add" id="addDieBtn" type="button" aria-expanded="false" aria-controls="addPanel">+ Tambah Dadu</button>
    </div>
    <div class="toolbar-group">
      <span class="selection-count" id="selectionCount">0 dipilih</span>
      <button class="btn btn-ghost" id="selectAllBtn" type="button">Pilih Semua</button>
      <button class="btn btn-ghost" id="clearSelectionBtn" type="button">Batal Pilih</button>
      <button class="btn btn-reroll" id="rerollSelectedBtn" type="button" disabled>Reroll Terpilih</button>
    </div>
  </section>

  <section class="add-panel" id="addPanel" hidden>
    <div class="add-panel-head">
      <h2>Dadu baru</h2>
      <button class="icon-btn" id="closeAddPanel" type="button" title="Tutup" style="width:32px;height:32px;">✕</button>
    </div>
    <div class="add-panel-body">
      <div>
        <span class="field-label">Jumlah sisi</span>
        <select class="select-control" id="addSidesSelect">
          <option value="2">d2 (koin)</option>
          <option value="4">d4</option>
          <option value="6" selected>d6</option>
          <option value="8">d8</option>
          <option value="10">d10</option>
          <option value="12">d12</option>
          <option value="20">d20</option>
          <option value="100">d100</option>
          <option value="custom">Custom…</option>
        </select>
        <br>
        <input type="number" class="number-control" id="addSidesCustom" min="2" max="1000" value="30" hidden>
      </div>
      <div>
        <span class="field-label">Warna dadu</span>
        <div class="swatch-row" id="addColorSwatches"></div>
      </div>
      <div class="add-panel-actions">
        <button class="btn btn-add-confirm" id="confirmAddBtn" type="button">Tambahkan</button>
      </div>
    </div>
  </section>

  <section class="dice-grid" id="diceGrid" aria-live="polite"></section>

</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastMsg"></span>
  <button id="toastUndo" type="button">Urungkan</button>
</div>

<script>
(function(){
  "use strict";

  /* ============ DATA ============ */
  var PALETTE = [
    {name:"Sky Blue", hex:"#3CB4E6"},
    {name:"Emerald Green", hex:"#32B18E"},
    {name:"Hot Pink", hex:"#F05696"},
    {name:"Deep Orange", hex:"#FF8040"},
    {name:"Sunny Yellow", hex:"#FFD730"},
    {name:"Deep Magenta", hex:"#9C208C"},
    {name:"Golden Bronze", hex:"#B89C57"},
    {name:"Metallic Silver", hex:"#959595"},
    {name:"Midnight Blue", hex:"#001F4F"}
  ];
  var STANDARD_SIDES = [2,4,6,8,10,12,20,100];
  var STORAGE_KEY = "happy-prism-dice-v1";

  var dice = [];
  var dieRefs = {};
  var soundOn = true;
  var lastDeleted = null;
  var undoTimer = null;
  var openPopoverCloser = null;
  var audioCtx = null;

  /* ============ HELPERS ============ */
  function uid(){ return "d" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function clamp(n, min, max){ return Math.min(max, Math.max(min, n)); }
  function randomValue(sides){ return 1 + Math.floor(Math.random() * sides); }
  function randomPaletteColor(){ return PALETTE[Math.floor(Math.random()*PALETTE.length)].hex; }
  function sidesSelectValue(sides){ return STANDARD_SIDES.indexOf(sides) !== -1 ? String(sides) : "custom"; }

  function hexToRgb(hex){
    var h = hex.replace("#","");
    if(h.length === 3){ h = h.split("").map(function(c){ return c+c; }).join(""); }
    var num = parseInt(h,16);
    return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
  }
  function contrastText(hex){
    try{
      var rgb = hexToRgb(hex);
      var a = [rgb.r, rgb.g, rgb.b].map(function(v){
        v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
      });
      var lum = a[0]*0.2126 + a[1]*0.7152 + a[2]*0.0722;
      return lum > 0.42 ? "#001F4F" : "#F4F5F7";
    }catch(e){ return "#F4F5F7"; }
  }

  /* ============ AUDIO ============ */
  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ audioCtx = null; }
    }
    return audioCtx;
  }
  function playBlip(freq, dur, type, vol){
    if(!soundOn) return;
    var ctx = ensureAudio();
    if(!ctx) return;
    try{
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = type || "square";
      osc.frequency.value = freq;
      gain.gain.value = vol || 0.05;
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + (dur||0.05));
      osc.stop(ctx.currentTime + (dur||0.05) + 0.02);
    }catch(e){}
  }

  /* ============ PERSISTENCE ============ */
  function save(){
    try{
      var theme = document.documentElement.getAttribute("data-theme") || "";
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify({ dice: dice, soundOn: soundOn, theme: theme }));
    }catch(e){}
  }
  function load(){
    try{
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      var parsed = JSON.parse(raw);
      if(!parsed || !Array.isArray(parsed.dice)) return null;
      return parsed;
    }catch(e){ return null; }
  }

  /* ============ DOM REFS ============ */
  var rollAllBtn = document.getElementById("rollAllBtn");
  var diceCountLabel = document.getElementById("diceCountLabel");
  var sumLabel = document.getElementById("sumLabel");
  var addDieBtn = document.getElementById("addDieBtn");
  var addPanel = document.getElementById("addPanel");
  var closeAddPanel = document.getElementById("closeAddPanel");
  var addSidesSelect = document.getElementById("addSidesSelect");
  var addSidesCustom = document.getElementById("addSidesCustom");
  var addColorSwatches = document.getElementById("addColorSwatches");
  var confirmAddBtn = document.getElementById("confirmAddBtn");
  var selectionCount = document.getElementById("selectionCount");
  var selectAllBtn = document.getElementById("selectAllBtn");
  var clearSelectionBtn = document.getElementById("clearSelectionBtn");
  var rerollSelectedBtn = document.getElementById("rerollSelectedBtn");
  var diceGrid = document.getElementById("diceGrid");
  var soundToggle = document.getElementById("soundToggle");
  var themeToggle = document.getElementById("themeToggle");
  var toast = document.getElementById("toast");
  var toastMsg = document.getElementById("toastMsg");
  var toastUndo = document.getElementById("toastUndo");

  var addPanelColor = randomPaletteColor();

  /* ============ COLOR PICKER BUILDER ============ */
  function buildSwatches(container, selectedColor, onPick){
    container.innerHTML = "";
    PALETTE.forEach(function(c){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "swatch" + (selectedColor === c.hex ? " is-active" : "");
      btn.style.background = c.hex;
      btn.title = c.name;
      btn.setAttribute("aria-label", c.name);
      btn.addEventListener("click", function(){ onPick(c.hex); });
      container.appendChild(btn);
    });
    var prismBtn = document.createElement("button");
    prismBtn.type = "button";
    prismBtn.className = "swatch swatch-prism" + (selectedColor === "prismatic" ? " is-active" : "");
    prismBtn.title = "Prismatic Gradient";
    prismBtn.setAttribute("aria-label", "Prismatic Gradient");
    prismBtn.addEventListener("click", function(){ onPick("prismatic"); });
    container.appendChild(prismBtn);

    var currentCustom = (selectedColor && selectedColor !== "prismatic") ? selectedColor : "#3CB4E6";

    var group = document.createElement("span");
    group.className = "custom-color-group";

    var swatchLabel = document.createElement("label");
    swatchLabel.className = "swatch-custom";
    swatchLabel.title = "Warna custom — klik untuk buka pemilih warna penuh (semua warna, bukan cuma daftar di atas)";
    var customInput = document.createElement("input");
    customInput.type = "color";
    customInput.className = "color-input-native";
    customInput.setAttribute("aria-label", "Pilih warna custom dari pemilih warna penuh");
    customInput.value = currentCustom;
    var plusIcon = document.createElement("span");
    plusIcon.className = "plus-icon";
    plusIcon.textContent = "+";
    plusIcon.setAttribute("aria-hidden", "true");
    swatchLabel.appendChild(customInput);
    swatchLabel.appendChild(plusIcon);

    var hexInput = document.createElement("input");
    hexInput.type = "text";
    hexInput.className = "hex-input";
    hexInput.placeholder = "#RRGGBB";
    hexInput.maxLength = 7;
    hexInput.value = currentCustom.toUpperCase();
    hexInput.setAttribute("aria-label", "Ketik kode warna hex, contoh #3CB4E6");
    hexInput.setAttribute("spellcheck", "false");

    function commitHex(){
      var v = hexInput.value.trim();
      if(v && v[0] !== "#") v = "#" + v;
      if(/^#[0-9A-Fa-f]{6}$/.test(v)){
        customInput.value = v;
        onPick(v);
      }else{
        hexInput.value = customInput.value.toUpperCase();
      }
    }
    hexInput.addEventListener("change", commitHex);
    hexInput.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ commitHex(); hexInput.blur(); }
    });
    customInput.addEventListener("input", function(e){
      hexInput.value = e.target.value.toUpperCase();
      onPick(e.target.value);
    });

    group.appendChild(swatchLabel);
    group.appendChild(hexInput);
    container.appendChild(group);
  }

  function onPickWrapper(hex){
    addPanelColor = hex;
    buildSwatches(addColorSwatches, addPanelColor, onPickWrapper);
  }
  buildSwatches(addColorSwatches, addPanelColor, onPickWrapper);

  /* ============ ADD PANEL ============ */
  function toggleAddPanel(force){
    var willOpen = typeof force === "boolean" ? force : addPanel.hasAttribute("hidden");
    if(willOpen){
      addPanel.removeAttribute("hidden");
      addDieBtn.setAttribute("aria-expanded","true");
      addSidesSelect.focus();
    }else{
      addPanel.setAttribute("hidden","");
      addDieBtn.setAttribute("aria-expanded","false");
    }
  }
  addDieBtn.addEventListener("click", function(){ toggleAddPanel(); });
  closeAddPanel.addEventListener("click", function(){ toggleAddPanel(false); });

  addSidesSelect.addEventListener("change", function(){
    addSidesCustom.hidden = addSidesSelect.value !== "custom";
    if(!addSidesCustom.hidden) addSidesCustom.focus();
  });

  confirmAddBtn.addEventListener("click", function(){
    var sides = addSidesSelect.value === "custom" ? clamp(parseInt(addSidesCustom.value,10) || 6, 2, 1000) : parseInt(addSidesSelect.value,10);
    addDie(sides, addPanelColor);
    addPanelColor = randomPaletteColor();
    buildSwatches(addColorSwatches, addPanelColor, onPickWrapper);
  });

  /* ============ CRUD ============ */
  function addDie(sides, color){
    var die = { id: uid(), sides: sides, color: color, value: randomValue(sides), selected: false };
    dice.push(die);
    renderAll();
    save();
    var el = dieRefs[die.id] && dieRefs[die.id].card;
    if(el){
      el.classList.add("is-new");
      el.scrollIntoView({ behavior:"smooth", block:"nearest" });
      setTimeout(function(){ el.classList.remove("is-new"); }, 1200);
    }
    rollDieAnimated(die.id, { delay: 0, silent:false });
  }

  function duplicateDie(id){
    var idx = dice.findIndex(function(d){ return d.id === id; });
    if(idx === -1) return;
    var orig = dice[idx];
    var copy = { id: uid(), sides: orig.sides, color: orig.color, value: randomValue(orig.sides), selected:false };
    dice.splice(idx+1, 0, copy);
    renderAll();
    save();
    var el = dieRefs[copy.id] && dieRefs[copy.id].card;
    if(el){
      el.classList.add("is-new");
      el.scrollIntoView({ behavior:"smooth", block:"nearest" });
      setTimeout(function(){ el.classList.remove("is-new"); }, 1200);
    }
  }

  function deleteDie(id){
    var idx = dice.findIndex(function(d){ return d.id === id; });
    if(idx === -1) return;
    var removed = dice.splice(idx,1)[0];
    lastDeleted = { die: removed, index: idx };
    renderAll();
    save();
    showToast("Dadu d" + removed.sides + " dihapus.", function(){
      if(lastDeleted){
        dice.splice(lastDeleted.index, 0, lastDeleted.die);
        lastDeleted = null;
        renderAll();
        save();
      }
      hideToast();
    });
    clearTimeout(undoTimer);
    undoTimer = setTimeout(function(){ lastDeleted = null; hideToast(); }, 5000);
  }

  function updateDieSides(id, sides){
    var die = dice.find(function(d){ return d.id === id; });
    if(!die) return;
    die.sides = sides;
    if(die.value > sides) die.value = sides;
    var refs = dieRefs[id];
    if(refs){
      refs.badge.textContent = "d" + sides;
      refs.valueEl.textContent = die.value;
      updateCritState(die, refs);
    }
    save();
  }

  function updateDieColor(id, color){
    var die = dice.find(function(d){ return d.id === id; });
    if(!die) return;
    die.color = color;
    var refs = dieRefs[id];
    if(refs) applyDieColor(die, refs);
    save();
  }

  /* ============ ROLL LOGIC ============ */
  function applyDieColor(die, refs){
    if(die.color === "prismatic"){
      refs.face.classList.add("is-prismatic");
      refs.card.classList.add("is-prismatic-border");
      refs.face.style.background = "";
      refs.face.style.color = "";
      refs.card.style.borderColor = "";
      refs.colorDot.style.background = "conic-gradient(var(--c-sky), var(--c-emerald), var(--c-yellow), var(--c-orange), var(--c-pink), var(--c-magenta))";
    }else{
      refs.face.classList.remove("is-prismatic");
      refs.card.classList.remove("is-prismatic-border");
      refs.face.style.background = die.color;
      refs.face.style.color = contrastText(die.color);
      refs.card.style.borderColor = die.color;
      refs.colorDot.style.background = die.color;
    }
  }

  function updateCritState(die, refs){
    refs.face.classList.remove("is-crit","is-fumble");
    if(die.sides > 1 && die.value === die.sides) refs.face.classList.add("is-crit");
    else if(die.value === 1 && die.sides > 1) refs.face.classList.add("is-fumble");
  }

  function rollDieAnimated(id, opts){
    opts = opts || {};
    var die = dice.find(function(d){ return d.id === id; });
    var refs = dieRefs[id];
    if(!die || !refs) return;
    setTimeout(function(){
      refs.face.classList.remove("is-settled");
      refs.face.classList.add("is-rolling");
      if(refs.rerollBtn) refs.rerollBtn.classList.add("is-busy");
      var ticks = 0;
      var maxTicks = 7;
      var interval = setInterval(function(){
        refs.valueEl.textContent = randomValue(die.sides);
        playBlip(280 + Math.random()*380, 0.03, "square", 0.025);
        ticks++;
        if(ticks >= maxTicks){
          clearInterval(interval);
          die.value = randomValue(die.sides);
          refs.valueEl.textContent = die.value;
          refs.face.classList.remove("is-rolling");
          refs.face.classList.add("is-settled");
          if(refs.rerollBtn) refs.rerollBtn.classList.remove("is-busy");
          updateCritState(die, refs);
          playBlip(170, 0.14, "sine", 0.06);
          updateStatsUI();
          save();
        }
      }, 60);
    }, opts.delay || 0);
  }

  function rollAll(){
    if(dice.length === 0) return;
    rollAllBtn.classList.add("is-rolling");
    dice.forEach(function(d, i){ rollDieAnimated(d.id, { delay: i*45 }); });
    var totalTime = dice.length*45 + 7*60 + 120;
    setTimeout(function(){ rollAllBtn.classList.remove("is-rolling"); }, totalTime);
  }

  function rerollSelected(){
    var selected = dice.filter(function(d){ return d.selected; });
    if(selected.length === 0) return;
    selected.forEach(function(d, i){ rollDieAnimated(d.id, { delay: i*45 }); });
  }

  /* ============ SELECTION ============ */
  function updateSelectionStats(){
    var n = dice.filter(function(d){ return d.selected; }).length;
    selectionCount.textContent = n + " dipilih";
    rerollSelectedBtn.disabled = n === 0;
    rerollSelectedBtn.textContent = n > 0 ? ("Reroll Terpilih (" + n + ")") : "Reroll Terpilih";
  }

  selectAllBtn.addEventListener("click", function(){
    dice.forEach(function(d){
      d.selected = true;
      var refs = dieRefs[d.id];
      if(refs){ refs.checkbox.checked = true; refs.card.classList.add("is-selected"); }
    });
    updateSelectionStats(); save();
  });
  clearSelectionBtn.addEventListener("click", function(){
    dice.forEach(function(d){
      d.selected = false;
      var refs = dieRefs[d.id];
      if(refs){ refs.checkbox.checked = false; refs.card.classList.remove("is-selected"); }
    });
    updateSelectionStats(); save();
  });
  rerollSelectedBtn.addEventListener("click", rerollSelected);
  rollAllBtn.addEventListener("click", rollAll);

  /* ============ STATS ============ */
  function updateStatsUI(){
    diceCountLabel.innerHTML = "<b>" + dice.length + "</b> dadu";
    var sum = dice.reduce(function(a,d){ return a + d.value; }, 0);
    sumLabel.innerHTML = "<b>" + sum + "</b> jumlah";
    rollAllBtn.disabled = dice.length === 0;
    updateSelectionStats();
  }

  /* ============ TOAST ============ */
  function showToast(message, onUndo){
    toastMsg.textContent = message;
    toast.classList.add("is-visible");
    toastUndo.onclick = function(){ onUndo(); };
  }
  function hideToast(){ toast.classList.remove("is-visible"); }

  /* ============ CARD CREATION ============ */
  function closeAnyOpenPopover(){
    if(openPopoverCloser){ openPopoverCloser(); openPopoverCloser = null; }
  }

  function createDieCard(die){
    var card = document.createElement("article");
    card.className = "die-card";
    card.dataset.id = die.id;

    // topbar
    var topbar = document.createElement("div");
    topbar.className = "die-topbar";

    var selectLabel = document.createElement("label");
    selectLabel.className = "die-select";
    var checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.setAttribute("aria-label", "Pilih dadu ini untuk reroll bersama");
    checkbox.addEventListener("change", function(){
      die.selected = checkbox.checked;
      card.classList.toggle("is-selected", die.selected);
      updateSelectionStats(); save();
    });
    selectLabel.appendChild(checkbox);

    var badge = document.createElement("span");
    badge.className = "die-type-badge";
    badge.textContent = "d" + die.sides;

    var iconActions = document.createElement("div");
    iconActions.className = "die-icon-actions";
    var dupBtn = document.createElement("button");
    dupBtn.type = "button"; dupBtn.className = "die-mini-btn dup"; dupBtn.title = "Duplikat dadu"; dupBtn.setAttribute("aria-label","Duplikat dadu");
    dupBtn.textContent = "⧉";
    dupBtn.addEventListener("click", function(){ duplicateDie(die.id); });
    var delBtn = document.createElement("button");
    delBtn.type = "button"; delBtn.className = "die-mini-btn delete"; delBtn.title = "Hapus dadu"; delBtn.setAttribute("aria-label","Hapus dadu");
    delBtn.textContent = "✕";
    delBtn.addEventListener("click", function(){ deleteDie(die.id); });
    iconActions.appendChild(dupBtn); iconActions.appendChild(delBtn);

    topbar.appendChild(selectLabel);
    topbar.appendChild(badge);
    topbar.appendChild(iconActions);

    // face
    var face = document.createElement("button");
    face.type = "button";
    face.className = "die-face";
    face.title = "Klik untuk reroll dadu ini";
    var valueEl = document.createElement("span");
    valueEl.textContent = die.value;
    face.appendChild(valueEl);
    face.addEventListener("click", function(){ rollDieAnimated(die.id); });

    // controls
    var controls = document.createElement("div");
    controls.className = "die-controls";

    var sidesField = document.createElement("div");
    sidesField.className = "die-field";
    var sidesLabel = document.createElement("label");
    sidesLabel.textContent = "Sisi";
    var sidesSelect = document.createElement("select");
    sidesSelect.className = "die-sides-select";
    [2,4,6,8,10,12,20,100].forEach(function(n){
      var opt = document.createElement("option");
      opt.value = String(n); opt.textContent = "d"+n;
      sidesSelect.appendChild(opt);
    });
    var customOpt = document.createElement("option");
    customOpt.value = "custom"; customOpt.textContent = "Custom…";
    sidesSelect.appendChild(customOpt);
    sidesSelect.value = sidesSelectValue(die.sides);

    var customInput = document.createElement("input");
    customInput.type = "number"; customInput.min = "2"; customInput.max = "1000";
    customInput.className = "die-sides-custom";
    customInput.value = die.sides;
    customInput.hidden = sidesSelect.value !== "custom";

    sidesSelect.addEventListener("change", function(){
      if(sidesSelect.value === "custom"){
        customInput.hidden = false;
        customInput.value = die.sides;
        customInput.focus();
      }else{
        customInput.hidden = true;
        updateDieSides(die.id, parseInt(sidesSelect.value,10));
      }
    });
    customInput.addEventListener("change", function(){
      var v = clamp(parseInt(customInput.value,10) || 2, 2, 1000);
      customInput.value = v;
      updateDieSides(die.id, v);
    });

    sidesField.appendChild(sidesLabel);
    sidesField.appendChild(sidesSelect);
    controls.appendChild(sidesField);
    controls.appendChild(customInput);

    var colorField = document.createElement("div");
    colorField.className = "die-color-field";
    var colorToggle = document.createElement("button");
    colorToggle.type = "button";
    colorToggle.className = "color-swatch-toggle";
    var colorDot = document.createElement("span");
    colorDot.className = "dot";
    var colorLabel = document.createElement("span");
    colorLabel.textContent = "Warna";
    colorToggle.appendChild(colorDot);
    colorToggle.appendChild(colorLabel);

    var popover = document.createElement("div");
    popover.className = "color-popover";
    popover.hidden = true;

    function closePopover(){
      popover.hidden = true;
      card.classList.remove("popover-open");
    }
    function openPopover(){
      closeAnyOpenPopover();
      popover.hidden = false;
      card.classList.add("popover-open");
      openPopoverCloser = closePopover;
    }
    colorToggle.addEventListener("click", function(e){
      e.stopPropagation();
      if(popover.hidden) openPopover(); else closePopover();
    });

    function refreshPopoverSwatches(){
      buildSwatches(popover, die.color, function(hex){
        updateDieColor(die.id, hex);
        refreshPopoverSwatches();
      });
    }
    refreshPopoverSwatches();

    colorField.appendChild(colorToggle);
    colorField.appendChild(popover);
    controls.appendChild(colorField);

    var rerollBtn = document.createElement("button");
    rerollBtn.type = "button";
    rerollBtn.className = "die-reroll-btn";
    rerollBtn.innerHTML = '<span class="spin-ic">↻</span><span>Reroll</span>';
    rerollBtn.addEventListener("click", function(){ rollDieAnimated(die.id); });
    controls.appendChild(rerollBtn);

    card.appendChild(topbar);
    card.appendChild(face);
    card.appendChild(controls);

    dieRefs[die.id] = {
      card: card, face: face, valueEl: valueEl, badge: badge,
      checkbox: checkbox, colorDot: colorDot, rerollBtn: rerollBtn
    };

    applyDieColor(die, dieRefs[die.id]);
    updateCritState(die, dieRefs[die.id]);
    checkbox.checked = die.selected;
    card.classList.toggle("is-selected", die.selected);

    return card;
  }

  /* ============ RENDER ============ */
  function renderAll(){
    diceGrid.innerHTML = "";
    dieRefs = {};
    if(dice.length === 0){
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.innerHTML = '<span class="empty-emoji">🎲</span><h3>Belum ada dadu</h3><p>Tambahkan dadu pertamamu untuk mulai bermain.</p>';
      var addBtn = document.createElement("button");
      addBtn.className = "btn btn-add"; addBtn.type = "button";
      addBtn.textContent = "+ Tambah Dadu";
      addBtn.addEventListener("click", function(){ toggleAddPanel(true); });
      empty.appendChild(addBtn);
      diceGrid.appendChild(empty);
    }else{
      dice.forEach(function(die){
        diceGrid.appendChild(createDieCard(die));
      });
    }
    updateStatsUI();
  }

  /* ============ THEME & SOUND ============ */
  function applyThemeIcon(){
    var attr = document.documentElement.getAttribute("data-theme");
    var isDark = attr === "dark" || (!attr && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    themeToggle.textContent = isDark ? "☀️" : "🌙";
  }
  themeToggle.addEventListener("click", function(){
    var current = document.documentElement.getAttribute("data-theme");
    var isDark = current === "dark" || (!current && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", isDark ? "light" : "dark");
    applyThemeIcon();
    save();
  });
  soundToggle.addEventListener("click", function(){
    soundOn = !soundOn;
    soundToggle.setAttribute("aria-pressed", String(soundOn));
    soundToggle.textContent = soundOn ? "🔊" : "🔇";
    save();
  });

  /* ============ GLOBAL CLOSE POPOVER ON OUTSIDE CLICK ============ */
  document.addEventListener("click", function(e){
    if(!openPopoverCloser) return;
    var t = e.target;
    if(t && t.closest && (t.closest(".color-popover") || t.closest(".color-swatch-toggle"))) return;
    openPopoverCloser();
    openPopoverCloser = null;
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && openPopoverCloser){ openPopoverCloser(); openPopoverCloser = null; }
  });

  /* ============ INIT ============ */
  function init(){
    var saved = load();
    if(saved){
      dice = saved.dice.map(function(d){
        return {
          id: d.id || uid(),
          sides: Math.max(2, parseInt(d.sides,10) || 6),
          color: d.color || randomPaletteColor(),
          value: d.value || 1,
          selected: false
        };
      });
      soundOn = typeof saved.soundOn === "boolean" ? saved.soundOn : true;
      if(saved.theme){ document.documentElement.setAttribute("data-theme", saved.theme); }
    }else{
      dice = [
        { id: uid(), sides:6, color:"#3CB4E6", value:4, selected:false },
        { id: uid(), sides:6, color:"#F05696", value:2, selected:false },
        { id: uid(), sides:20, color:"prismatic", value:15, selected:false }
      ];
    }
    soundToggle.setAttribute("aria-pressed", String(soundOn));
    soundToggle.textContent = soundOn ? "🔊" : "🔇";
    applyThemeIcon();
    renderAll();
  }

  init();
})();
</script>
</body>
</html>
