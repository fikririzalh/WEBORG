<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dice Pool Party — Kocok &amp; Skor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
<style>
/* ==========================================================================
   Dice Pool Party — dice roller + scoreboard
   ========================================================================== */

:root{
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;

  --bg: #eaf6f6;
  --bg-glow: #d9f0ef;
  --surface: #ffffff;
  --surface-2: #f3fbfa;
  --text: #0f2a2e;
  --muted: #5b7b7e;
  --accent: #0e9aa6;
  --accent-strong: #087a86;
  --border: #cdeae8;
  --danger: #d3455f;
  --danger-strong: #b3324a;

  --tile-closed: #bfe3e0;
  --tile-closed-border: #8fcdcb;

  --btn-text: #ffffff;
  --shadow: 0 18px 40px -20px rgba(14, 60, 65, 0.35);
  --shadow-sm: 0 8px 20px -12px rgba(14, 60, 65, 0.3);

  --die-pink: #ff4fa3;   --die-pink-pip: #ffffff;
  --die-ungu: #8b5cf6;   --die-ungu-pip: #ffffff;
  --die-kuning: #ffd400; --die-kuning-pip: #1a1a1a;
  --die-biru: #2f7dff;   --die-biru-pip: #ffffff;
  --die-hijau: #22c55e;  --die-hijau-pip: #ffffff;
  --die-putih: #ffffff;  --die-putih-pip: #1a1a1a;
  --die-putih-border: #b8c4c6;
}

:root[data-theme="dark"]{
  --bg: #071620;
  --bg-glow: #0b202c;
  --surface: #0e2530;
  --surface-2: #102a36;
  --text: #eaf6f6;
  --muted: #7fa3a8;
  --accent: #35d7c6;
  --accent-strong: #24b6a6;
  --border: #163943;
  --danger: #ff6b81;
  --danger-strong: #ff4f6a;

  --tile-closed: #12313b;
  --tile-closed-border: #1e4650;

  --btn-text: #05201d;
  --shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.6);
  --shadow-sm: 0 8px 18px -10px rgba(0,0,0,.5);

  --die-putih-border: #3a4b4e;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: #071620; --bg-glow: #0b202c; --surface: #0e2530; --surface-2: #102a36;
    --text: #eaf6f6; --muted: #7fa3a8; --accent: #35d7c6; --accent-strong: #24b6a6;
    --border: #163943; --danger: #ff6b81; --danger-strong: #ff4f6a;
    --tile-closed: #12313b; --tile-closed-border: #1e4650;
    --btn-text: #05201d; --shadow: 0 18px 40px -18px rgba(0,0,0,.6);
    --shadow-sm: 0 8px 18px -10px rgba(0,0,0,.5);
    --die-putih-border: #3a4b4e;
  }
}

*{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body{ margin: 0; min-height: 100%; }

body{
  font-family: var(--font);
  color: var(--text);
  background: radial-gradient(120% 100% at 50% -10%, var(--bg-glow), var(--bg) 60%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  transition: background-color .25s ease, color .25s ease;
}

.app{
  width: 100%;
  max-width: 560px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ---------------- Header ---------------- */

.app-header{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 18px 18px 4px;
}
.brand{ display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-dice{ font-size: 32px; line-height: 1; filter: drop-shadow(0 4px 8px rgba(0,0,0,.15)); flex: 0 0 auto; }
.brand-text{ min-width: 0; }
.brand-text h1{ margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; }
.tagline{ margin: 2px 0 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.theme-toggle{
  flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--surface);
  display: grid; place-items: center; cursor: pointer; font-size: 17px;
  transition: transform .15s ease;
}
.theme-toggle:active{ transform: scale(.92); }
.theme-toggle .icon-moon{ display: none; }
:root[data-theme="dark"] .theme-toggle .icon-sun{ display: none; }
:root[data-theme="dark"] .theme-toggle .icon-moon{ display: inline; }

/* ---------------- Panels ---------------- */

.panels{
  flex: 1;
  padding: 16px 18px 100px; /* room for fixed tabbar */
}
.panel{ display: none; flex-direction: column; align-items: center; gap: 18px; }
.panel.active{ display: flex; }

/* ---------------- Dice stage (unchanged mechanic) ---------------- */

.pool-frame{
  position: relative; width: 100%; background: var(--surface);
  border: 1px solid var(--border); border-radius: 26px;
  padding: 34px 16px 22px; box-shadow: var(--shadow); overflow: hidden;
}
.pool-frame::before{
  content: ""; position: absolute; inset: -40% -20% auto -20%; height: 140px;
  background: radial-gradient(60% 100% at 50% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%);
  pointer-events: none;
}
.pool-bar{ position: absolute; top: 0; left: 0; right: 0; height: 5px; }
.pool-bar-fill{ height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-strong)); }

.pool-badge{
  position: absolute; top: 12px; right: 16px; font-size: 10.5px; font-weight: 700;
  letter-spacing: .06em; color: var(--muted);
  background: color-mix(in srgb, var(--tile-closed) 55%, transparent);
  border: 1px solid var(--border); padding: 4px 9px; border-radius: 999px;
}

.pool{ position: relative; display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px 6px; z-index: 1; }
@media (max-width: 460px){ .pool{ grid-template-columns: repeat(3, 1fr); } }

.color-group{ display: flex; flex-direction: column; align-items: center; gap: 6px; }
.dice-pair{ display: flex; flex-direction: column; gap: 6px; }
.color-label{ font-size: 10px; font-weight: 700; color: var(--muted); text-align: center; line-height: 1.15; }

.die{
  --pip: transparent; width: 100%; aspect-ratio: 1; min-width: 40px; border-radius: 11px;
  background: var(--tile-closed); border: 1.5px solid var(--tile-closed-border);
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
  padding: 15%; gap: 2px;
  transform: perspective(400px) rotateY(0deg);
  transition: transform .38s cubic-bezier(.34,1.56,.64,1), background-color .3s ease, border-color .3s ease;
}
.die .dot{
  align-self: center; justify-self: center; width: 62%; height: 62%; border-radius: 50%;
  background: var(--pip); opacity: 0; transition: opacity .15s ease .15s;
}
.die[data-value="1"] .dot:nth-child(5),
.die[data-value="2"] .dot:nth-child(1), .die[data-value="2"] .dot:nth-child(9),
.die[data-value="3"] .dot:nth-child(1), .die[data-value="3"] .dot:nth-child(5), .die[data-value="3"] .dot:nth-child(9),
.die[data-value="4"] .dot:nth-child(1), .die[data-value="4"] .dot:nth-child(3), .die[data-value="4"] .dot:nth-child(7), .die[data-value="4"] .dot:nth-child(9),
.die[data-value="5"] .dot:nth-child(1), .die[data-value="5"] .dot:nth-child(3), .die[data-value="5"] .dot:nth-child(5), .die[data-value="5"] .dot:nth-child(7), .die[data-value="5"] .dot:nth-child(9),
.die[data-value="6"] .dot:nth-child(1), .die[data-value="6"] .dot:nth-child(3), .die[data-value="6"] .dot:nth-child(4), .die[data-value="6"] .dot:nth-child(6), .die[data-value="6"] .dot:nth-child(7), .die[data-value="6"] .dot:nth-child(9){
  opacity: 1;
}

.pool[data-state="closed"] .die{ background: var(--tile-closed) !important; border-color: var(--tile-closed-border) !important; }
.pool[data-state="closed"] .die .dot{ opacity: 0 !important; }

.pool[data-state="open"] .die[data-color="pink"]{ background: var(--die-pink); border-color: var(--die-pink); --pip: var(--die-pink-pip); }
.pool[data-state="open"] .die[data-color="ungu"]{ background: var(--die-ungu); border-color: var(--die-ungu); --pip: var(--die-ungu-pip); }
.pool[data-state="open"] .die[data-color="kuning"]{ background: var(--die-kuning); border-color: var(--die-kuning); --pip: var(--die-kuning-pip); }
.pool[data-state="open"] .die[data-color="biru"]{ background: var(--die-biru); border-color: var(--die-biru); --pip: var(--die-biru-pip); }
.pool[data-state="open"] .die[data-color="hijau"]{ background: var(--die-hijau); border-color: var(--die-hijau); --pip: var(--die-hijau-pip); }
.pool[data-state="open"] .die[data-color="putih"]{ background: var(--die-putih); border-color: var(--die-putih-border); --pip: var(--die-putih-pip); }

.pool[data-state="shaking"] .die{ animation: shake .55s ease-in-out infinite; }
@keyframes shake{
  0%{ transform: rotate(0deg) translate(0,0); }
  20%{ transform: rotate(-6deg) translate(-2px, 1px); }
  40%{ transform: rotate(5deg) translate(2px, -1px); }
  60%{ transform: rotate(-4deg) translate(-1px, 2px); }
  80%{ transform: rotate(6deg) translate(1px, -2px); }
  100%{ transform: rotate(0deg) translate(0,0); }
}
.pool[data-state="open"] .die{ transform: perspective(400px) rotateY(360deg); }

@media (prefers-reduced-motion: reduce){
  .pool[data-state="shaking"] .die{ animation: none; }
  .die{ transition: background-color .2s ease, border-color .2s ease; transform: none !important; }
}

.roll-btn{
  width: 100%; max-width: 320px; border: none; border-radius: 999px;
  background: linear-gradient(180deg, var(--accent), var(--accent-strong));
  color: var(--btn-text); font-family: inherit; font-size: 16.5px; font-weight: 800;
  padding: 16px 18px; display: flex; align-items: center; justify-content: center; gap: 10px;
  cursor: pointer; box-shadow: 0 14px 28px -10px color-mix(in srgb, var(--accent) 65%, transparent);
  transition: transform .12s ease, opacity .2s ease;
}
.roll-btn:active{ transform: scale(.98); }
.roll-btn:disabled{ opacity: .6; }
.roll-btn:focus-visible{ outline: 3px solid var(--accent); outline-offset: 3px; }
.roll-btn-icon{ font-size: 19px; }

.status{ margin: 0; text-align: center; font-size: 13.5px; color: var(--muted); min-height: 20px; }
.status.status-live{ color: var(--accent-strong); font-weight: 700; }

.legend{ text-align: center; font-size: 11.5px; color: var(--muted); margin: 0; }
.legend b{ font-weight: 700; }
.c-pink{ color: var(--die-pink); } .c-ungu{ color: var(--die-ungu); }
.c-kuning{ color: color-mix(in srgb, var(--die-kuning) 78%, black 12%); }
.c-biru{ color: var(--die-biru); } .c-hijau{ color: var(--die-hijau); } .c-putih{ color: var(--muted); }

/* ---------------- Scoreboard panel ---------------- */

.skor-toolbar{ display: flex; gap: 10px; width: 100%; }
.btn-primary, .btn-ghost{
  font-family: inherit; font-size: 14.5px; font-weight: 700; border-radius: 999px;
  padding: 12px 16px; cursor: pointer; border: none; display: flex; align-items: center;
  justify-content: center; gap: 6px; transition: transform .12s ease, opacity .15s ease;
}
.btn-primary{ flex: 1; background: linear-gradient(180deg, var(--accent), var(--accent-strong)); color: var(--btn-text); box-shadow: var(--shadow-sm); }
.btn-ghost{ background: transparent; color: var(--danger); border: 1.5px solid color-mix(in srgb, var(--danger) 35%, transparent); }
.btn-primary:active, .btn-ghost:active{ transform: scale(.97); }

.player-list{ width: 100%; display: flex; flex-direction: column; gap: 12px; }

.empty-state{
  width: 100%; text-align: center; color: var(--muted); font-size: 13.5px;
  border: 1.5px dashed var(--border); border-radius: 18px; padding: 28px 16px;
}

.player-row{
  width: 100%; display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; box-shadow: var(--shadow-sm); padding: 10px 12px;
}

.rank-badge{
  flex: 0 0 auto; min-width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  font-size: 12px; font-weight: 800; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border);
}
.rank-badge.top1{ background: #ffe9a8; color: #7a5b00; border-color: #f0cf6d; }
.rank-badge.top2{ background: #e6e9ee; color: #555f6b; border-color: #cfd4dc; }
.rank-badge.top3{ background: #ffdcc4; color: #8a4a1c; border-color: #f2bd97; }

.player-name{
  flex: 1 1 auto; min-width: 0; border: none; background: transparent; color: var(--text);
  font-family: inherit; font-size: 15.5px; font-weight: 700; padding: 8px 6px; border-radius: 8px;
}
.player-name:focus{ background: var(--surface-2); outline: none; }

.score-colon{ flex: 0 0 auto; color: var(--muted); font-weight: 700; font-size: 15px; }

.score-input{
  width: 64px; flex: 0 0 auto; border: 1.5px solid var(--border); background: var(--surface-2);
  color: var(--accent-strong); font-family: inherit; font-size: 16px; font-weight: 800; text-align: center;
  border-radius: 10px; padding: 9px 4px; -moz-appearance: textfield;
}
.score-input::-webkit-outer-spin-button, .score-input::-webkit-inner-spin-button{ -webkit-appearance: none; margin: 0; }
.score-input:focus{ outline: none; border-color: var(--accent); }

.delete-player{
  flex: 0 0 auto; width: 34px; height: 34px; border-radius: 10px; border: none;
  background: transparent; color: var(--danger); font-size: 15px; cursor: pointer;
}
.delete-player:active{ background: color-mix(in srgb, var(--danger) 12%, transparent); }

.skor-footnote{ text-align: center; font-size: 11.5px; color: var(--muted); }

/* ---------------- Bottom tab bar ---------------- */

.tabbar{
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; justify-content: center;
  padding-bottom: env(safe-area-inset-bottom, 0);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--border);
}
.tabbar-inner{ width: 100%; max-width: 560px; display: flex; }
.tab-btn{
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 10px 0 12px; border: none; background: transparent; color: var(--muted);
  font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer;
}
.tab-btn .tab-icon{ font-size: 20px; }
.tab-btn.active{ color: var(--accent-strong); }

@media (prefers-reduced-motion: reduce){ .theme-toggle, .roll-btn, .btn-primary, .btn-ghost{ transition: none; } }
</style>
</head>
<body>

<div class="app">

  <header class="app-header">
    <div class="brand">
      <span class="brand-dice" aria-hidden="true">🎲</span>
      <div class="brand-text">
        <h1>Dice Pool Party</h1>
        <p class="tagline">Kocok dadu &amp; catat skor</p>
      </div>
    </div>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Ganti tampilan terang/gelap">
      <span class="icon-sun" aria-hidden="true">☀️</span>
      <span class="icon-moon" aria-hidden="true">🌙</span>
    </button>
  </header>

  <div class="panels">

    <!-- ================= DADU PANEL ================= -->
    <section id="panel-dadu" class="panel active">

      <div class="pool-frame">
        <div class="pool-bar" aria-hidden="true"><div id="poolBarFill" class="pool-bar-fill"></div></div>
        <div id="pool" class="pool" data-state="closed"></div>
        <div id="poolBadge" class="pool-badge" aria-hidden="true">TERTUTUP</div>
      </div>

      <button id="rollBtn" class="roll-btn" type="button">
        <span class="roll-btn-icon" aria-hidden="true">🎲</span>
        <span id="rollBtnLabel">Kocok Dadu!</span>
      </button>

      <p id="status" class="status" role="status" aria-live="polite">
        Tekan tombolnya untuk mengocok &amp; membuka dadu selama 3 detik.
      </p>

      <p class="legend">
        <b class="c-pink">Pink</b> · <b class="c-ungu">Ungu</b> · <b class="c-kuning">Kuning</b> ·
        <b class="c-biru">Biru</b> · <b class="c-hijau">Hijau</b> · <b class="c-putih">Putih</b>
      </p>
    </section>

    <!-- ================= SKOR PANEL ================= -->
    <section id="panel-skor" class="panel">

      <div class="skor-toolbar">
        <button id="addPlayerBtn" class="btn-primary" type="button">➕ Tambah Pemain</button>
        <button id="resetAllBtn" class="btn-ghost" type="button">Reset</button>
      </div>

      <div id="playerList" class="player-list"></div>
      <p id="emptyState" class="empty-state">Belum ada pemain. Tekan &ldquo;Tambah Pemain&rdquo; untuk mulai mencatat skor.</p>

      <p class="skor-footnote">Skor tersimpan otomatis di perangkat ini saja (offline).</p>
    </section>

  </div>

  <nav class="tabbar">
    <div class="tabbar-inner">
      <button class="tab-btn active" type="button" data-tab="dadu">
        <span class="tab-icon" aria-hidden="true">🎲</span><span>Dadu</span>
      </button>
      <button class="tab-btn" type="button" data-tab="skor">
        <span class="tab-icon" aria-hidden="true">🏆</span><span>Skor</span>
      </button>
    </div>
  </nav>

</div>

<script>
(function () {
  "use strict";

  /* =========================================================
     THEME TOGGLE
  ========================================================= */
  var root = document.documentElement;
  var THEME_KEY = "dice-pool-party-theme";

  function applyTheme(theme) {
    root.setAttribute("data-theme", theme);
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  }
  (function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    if (saved === "light" || saved === "dark") applyTheme(saved);
  })();
  document.getElementById("themeToggle").addEventListener("click", function () {
    var current = root.getAttribute("data-theme");
    var isDark = current === "dark" ||
      (current !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    applyTheme(isDark ? "light" : "dark");
  });

  /* =========================================================
     TAB SWITCHING
  ========================================================= */
  var tabBtns = document.querySelectorAll(".tab-btn");
  var panels = { dadu: document.getElementById("panel-dadu"), skor: document.getElementById("panel-skor") };

  tabBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      var target = btn.getAttribute("data-tab");
      tabBtns.forEach(function (b) { b.classList.toggle("active", b === btn); });
      Object.keys(panels).forEach(function (key) {
        panels[key].classList.toggle("active", key === target);
      });
    });
  });

  /* =========================================================
     DICE ROLLER  (kocok -> intip 3s -> tertutup -> buka utk cek skor)
  ========================================================= */
  var COLORS = [
    { key: "pink", label: "Pink" }, { key: "ungu", label: "Ungu" },
    { key: "kuning", label: "Kuning" }, { key: "biru", label: "Biru" },
    { key: "hijau", label: "Hijau" }, { key: "putih", label: "Putih" }
  ];
  var SHAKE_MS = 750;
  var REVEAL_MS = 3000;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var pool = document.getElementById("pool");
  var rollBtn = document.getElementById("rollBtn");
  var rollLabel = document.getElementById("rollBtnLabel");
  var statusEl = document.getElementById("status");
  var barFill = document.getElementById("poolBarFill");
  var poolBadge = document.getElementById("poolBadge");

  var allDice = [];
  COLORS.forEach(function (color) {
    var group = document.createElement("div");
    group.className = "color-group";
    var pair = document.createElement("div");
    pair.className = "dice-pair";
    for (var i = 0; i < 2; i++) {
      var die = document.createElement("div");
      die.className = "die";
      die.setAttribute("data-color", color.key);
      die.setAttribute("data-value", "1");
      for (var d = 0; d < 9; d++) {
        var dot = document.createElement("span");
        dot.className = "dot";
        die.appendChild(dot);
      }
      pair.appendChild(die);
      allDice.push(die);
    }
    var label = document.createElement("span");
    label.className = "color-label";
    label.textContent = color.label;
    group.appendChild(pair);
    group.appendChild(label);
    pool.appendChild(group);
  });

  var phase = "idle";

  function setStatus(text, live) {
    statusEl.textContent = text;
    statusEl.classList.toggle("status-live", !!live);
  }
  function randomValue() { return 1 + Math.floor(Math.random() * 6); }
  function setButton(label, enabled) { rollLabel.textContent = label; rollBtn.disabled = !enabled; }

  function startShakeAndPeek() {
    phase = "shaking";
    pool.setAttribute("data-state", "shaking");
    poolBadge.textContent = "MENGOCOK…";
    setStatus("Mengocok dadu…");
    setButton("Mengocok…", false);

    var shakeTime = reduceMotion ? 150 : SHAKE_MS;

    setTimeout(function () {
      allDice.forEach(function (die) { die.setAttribute("data-value", String(randomValue())); });

      phase = "peek";
      pool.setAttribute("data-state", "open");
      poolBadge.textContent = "TERBUKA";
      setStatus("Lihat baik-baik! Ingat posisinya…", true);

      var start = performance.now();
      barFill.style.width = "100%";

      function tick(now) {
        var elapsed = now - start;
        var remain = Math.max(0, REVEAL_MS - elapsed);
        barFill.style.width = (remain / REVEAL_MS * 100) + "%";
        if (remain > 0 && phase === "peek") requestAnimationFrame(tick);
        else if (phase === "peek") closeAfterPeek();
      }
      requestAnimationFrame(tick);
    }, shakeTime);
  }

  function closeAfterPeek() {
    phase = "awaitingCheck";
    pool.setAttribute("data-state", "closed");
    poolBadge.textContent = "TERTUTUP";
    barFill.style.width = "0%";
    setStatus("Tertutup. Pilih kategori kalian diam-diam. Sudah semua? Tekan tombolnya untuk membuka & mengecek dadu yang sebenarnya buat hitung skor.");
    setButton("👁️ Buka untuk Cek Skor", true);
  }

  function openForScoring() {
    phase = "checking";
    pool.setAttribute("data-state", "open");
    poolBadge.textContent = "TERBUKA — CEK SKOR";
    setStatus("Dadu terbuka. Cocokkan pilihan kategori kalian dengan dadu asli ini, lalu catat skornya di tab Skor. Siap ronde berikutnya? Tekan tombolnya.");
    setButton("🎲 Kocok Dadu (Ronde Berikutnya)", true);
  }

  rollBtn.addEventListener("click", function () {
    if (phase === "idle" || phase === "checking") startShakeAndPeek();
    else if (phase === "awaitingCheck") openForScoring();
  });

  /* =========================================================
     SCOREBOARD  (CRUD sederhana: nama : skor)
  ========================================================= */
  var STORAGE_KEY = "dice-pool-party-scoreboard-v2";
  var OLD_STORAGE_KEY = "dice-pool-party-scoreboard-v1";

  var playerList = document.getElementById("playerList");
  var emptyState = document.getElementById("emptyState");
  var addPlayerBtn = document.getElementById("addPlayerBtn");
  var resetAllBtn = document.getElementById("resetAllBtn");

  var state = { players: [], nextId: 1 };
  var cardRegistry = {}; // id -> { el, rankEl, scoreInput }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.players)) { state = parsed; return; }
      }
    } catch (e) {}

    // migrasi ringan dari versi lama (12 kategori) -> jadi 1 skor total
    try {
      var oldRaw = localStorage.getItem(OLD_STORAGE_KEY);
      if (oldRaw) {
        var oldParsed = JSON.parse(oldRaw);
        if (oldParsed && Array.isArray(oldParsed.players)) {
          state = {
            nextId: oldParsed.nextId || (oldParsed.players.length + 1),
            players: oldParsed.players.map(function (p) {
              var sum = 0, any = false;
              if (p.scores) {
                Object.keys(p.scores).forEach(function (k) {
                  var v = p.scores[k];
                  if (typeof v === "number" && !isNaN(v)) { sum += v; any = true; }
                });
              }
              return { id: p.id, name: p.name, score: any ? sum : null };
            })
          };
          saveState();
          return;
        }
      }
    } catch (e) {}

    state = { players: [], nextId: 1 };
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function scoreValueOf(player) {
    return (typeof player.score === "number" && !isNaN(player.score)) ? player.score : -Infinity;
  }

  function refreshEmptyState() {
    emptyState.style.display = state.players.length === 0 ? "block" : "none";
  }

  function updateRanks() {
    var entries = state.players.map(function (p) { return { id: p.id, val: scoreValueOf(p) }; });
    entries.sort(function (a, b) { return b.val - a.val; });

    var rank = 0;
    entries.forEach(function (entry, i) {
      if (i === 0) rank = 1;
      else if (entry.val !== entries[i - 1].val) rank = i + 1;

      var reg = cardRegistry[entry.id];
      if (!reg) return;
      reg.el.style.order = i;
      var showMedal = entry.val !== -Infinity;
      reg.rankEl.className = "rank-badge" + (showMedal && rank === 1 ? " top1" : showMedal && rank === 2 ? " top2" : showMedal && rank === 3 ? " top3" : "");
      reg.rankEl.textContent = !showMedal ? "–" : (rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : ("#" + rank));
    });
  }

  function createPlayerRow(player) {
    var row = document.createElement("div");
    row.className = "player-row";
    row.setAttribute("data-id", player.id);

    var rankEl = document.createElement("span");
    rankEl.className = "rank-badge";
    rankEl.textContent = "–";

    var nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.className = "player-name";
    nameInput.value = player.name;
    nameInput.setAttribute("aria-label", "Nama pemain");
    nameInput.addEventListener("input", function () {
      player.name = nameInput.value;
      saveState();
    });

    var colon = document.createElement("span");
    colon.className = "score-colon";
    colon.textContent = ":";

    var scoreInput = document.createElement("input");
    scoreInput.type = "number";
    scoreInput.inputMode = "numeric";
    scoreInput.className = "score-input";
    scoreInput.placeholder = "–";
    scoreInput.setAttribute("aria-label", "Skor " + player.name);
    if (typeof player.score === "number") scoreInput.value = player.score;
    scoreInput.addEventListener("focus", function () { scoreInput.select(); });
    scoreInput.addEventListener("input", function () {
      var raw = scoreInput.value.trim();
      if (raw === "") player.score = null;
      else {
        var n = parseInt(raw, 10);
        player.score = isNaN(n) ? null : n;
      }
      saveState();
      updateRanks();
    });

    var delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.className = "delete-player";
    delBtn.setAttribute("aria-label", "Hapus pemain");
    delBtn.textContent = "🗑️";
    delBtn.addEventListener("click", function () {
      var ok = window.confirm("Hapus " + (player.name || "pemain ini") + "?");
      if (!ok) return;
      state.players = state.players.filter(function (p) { return p.id !== player.id; });
      delete cardRegistry[player.id];
      row.remove();
      saveState();
      refreshEmptyState();
      updateRanks();
    });

    row.appendChild(rankEl);
    row.appendChild(nameInput);
    row.appendChild(colon);
    row.appendChild(scoreInput);
    row.appendChild(delBtn);

    cardRegistry[player.id] = { el: row, rankEl: rankEl, scoreInput: scoreInput };
    return row;
  }

  function addPlayer(name) {
    var player = { id: state.nextId++, name: name, score: null };
    state.players.push(player);
    saveState();

    var row = createPlayerRow(player);
    playerList.appendChild(row);
    refreshEmptyState();
    updateRanks();
    return row;
  }

  addPlayerBtn.addEventListener("click", function () {
    var count = state.players.length + 1;
    var row = addPlayer("Pemain " + count);
    var nameInput = row.querySelector(".player-name");
    if (nameInput) { nameInput.focus(); nameInput.select(); }
    row.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
  });

  resetAllBtn.addEventListener("click", function () {
    if (state.players.length === 0) return;
    var ok = window.confirm("Hapus semua pemain & skor? Tindakan ini tidak bisa dibatalkan.");
    if (!ok) return;
    state = { players: [], nextId: 1 };
    cardRegistry = {};
    playerList.innerHTML = "";
    saveState();
    refreshEmptyState();
  });

  /* ---- init scoreboard from storage ---- */
  loadState();
  state.players.forEach(function (player) {
    playerList.appendChild(createPlayerRow(player));
  });
  refreshEmptyState();
  updateRanks();

})();
</script>
</body>
</html>
