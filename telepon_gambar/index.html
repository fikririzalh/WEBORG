<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#001F4F"><title>Telepon Gambar — permainan oper gambar</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23001F4F'/%3E%3Cpath d='M13 41 39 14l11 11-26 26H13z' fill='%23FFD730'/%3E%3C/svg%3E"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#001F4F;background:#f4f8fb}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 90% 0,#ffd73060,transparent 30%),radial-gradient(circle at 0 45%,#3cb4e62a,transparent 32%),var(--bg,#f4f8fb);color:var(--ink,#001F4F)}body.dark{--bg:#071a35;--ink:#f0f0f0;--panel:#102b51;--muted:#b8c9da;--field:#09213f}button,input,textarea{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;max-width:760px;margin:auto;padding:20px 18px 0}header strong{font-size:1.05rem}main{max-width:760px;margin:auto;padding:18px 16px 48px}.card{background:var(--panel,#fff);border:2px solid #3cb4e638;border-radius:26px;padding:22px;box-shadow:0 14px 40px #001f4f13;margin-bottom:16px}h1{font-size:clamp(2rem,8vw,3.7rem);line-height:1.05;margin:8px 0 12px;letter-spacing:-.045em}h2{font-size:1.4rem;margin:0 0 12px}p{line-height:1.55;color:var(--muted,#43556f)}.eyebrow{font-weight:900;color:#9c208c;text-transform:uppercase;letter-spacing:.12em;font-size:.74rem}.hero{background:linear-gradient(135deg,#3cb4e6,#32b18e);color:#001F4F}.hero p{color:#092a4b}.btn{border:0;border-radius:15px;padding:13px 18px;font-weight:800;background:#ffd730;color:#001f4f;min-height:48px}.btn.secondary{background:#3cb4e625;color:var(--ink,#001f4f)}.btn.pink{background:#f05696;color:#001f4f}.btn:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row .compact{flex:0 0 auto}label{display:block;font-weight:750;margin:16px 0 7px}input,textarea{background:var(--field,#f6f9fd);color:var(--ink,#001f4f);border:2px solid #95959570;border-radius:14px;padding:12px;width:100%;outline:none}input:focus,textarea:focus{border-color:#3cb4e6}textarea{min-height:120px;resize:vertical}.small{font-size:.88rem}.muted{color:var(--muted,#53657a)}.pill{display:inline-block;border-radius:999px;background:#ffd730;color:#001f4f;padding:7px 12px;font-weight:800}.stage{background:#001f4f;color:white;padding:22px;border-radius:20px;margin:18px 0}.stage p{color:#e6eff9}.stage img{display:block;max-width:100%;max-height:55vh;object-fit:contain;background:white;border-radius:12px;margin:auto}.stage .words{font-size:clamp(1.2rem,5vw,2rem);font-weight:850;overflow-wrap:anywhere}.canvas-wrap{width:100%;border:3px solid #001f4f;border-radius:18px;overflow:hidden;background:#fff;touch-action:none}canvas{display:block;width:100%;height:auto;touch-action:none}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tools button{border:2px solid #9aaabd;background:var(--panel,#fff);color:var(--ink,#001f4f);border-radius:12px;padding:9px 11px;font-weight:700}.tools button.active{border-color:#f05696;box-shadow:0 0 0 2px #f05696}.swatch{width:42px;height:42px;border-radius:50%!important;padding:0!important}.error{color:#a80042;font-weight:700}.steps{padding-left:22px;line-height:1.65}.reveal{border-left:5px solid #32b18e;padding:8px 16px;margin:14px 0;background:#3cb4e61c;border-radius:0 14px 14px 0}.reveal img{max-width:100%;max-height:420px;background:#fff;border-radius:10px}.footer{text-align:center;font-size:.8rem}.center{text-align:center}.big{font-size:clamp(1.5rem,6vw,2.7rem);font-weight:900}.warning{border-left:5px solid #ff8040;padding:10px 14px;background:#ff804026;border-radius:8px}.switch{background:transparent;border:1px solid #959595;border-radius:99px;padding:8px 12px;color:var(--ink,#001f4f)}@media(max-width:480px){.card{padding:18px}.row>*{flex-basis:100%}.row .compact{flex:0 0 auto}}
</style></head><body><header><strong>✎ Telepon Gambar</strong><button class="switch" id="theme">☾ Mode gelap</button></header><main id="app"></main><script>
(()=>{'use strict';const KEY='telepon-gambar-v3',TKEY='telepon-gambar-theme';let game=null,canvas,ctx,history=[],painting=false,color='#001F4F';const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const names=n=>Array.from({length:n},(_,i)=>String.fromCharCode(65+i));function save(){try{localStorage.setItem(KEY,JSON.stringify(game));return true}catch{alert('Penyimpanan browser penuh. Kosongkan ruang lalu coba lagi.');return false}}try{game=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}function shuffle(a){let b=new Uint32Array(1);for(let i=a.length-1;i>0;i--){crypto.getRandomValues(b);let j=b[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}function makeSchedule(n){let offsets=shuffle(Array.from({length:n-1},(_,i)=>i+1));return names(n).map((_,owner)=>offsets.map(d=>(owner+d)%n))}function chart(schedule,n){return `<div style="overflow-x:auto"><table style="border-collapse:collapse;min-width:100%;text-align:center"><thead><tr><th style="padding:9px">Giliran</th>${names(n).map(x=>`<th style="padding:9px">HP ${x}</th>`).join('')}</tr></thead><tbody><tr><th style="padding:9px">Awal · tulis</th>${names(n).map(x=>`<td style="padding:9px">${x}</td>`).join('')}</tr>${Array.from({length:n-1},(_,step)=>`<tr style="background:${step%2?'#32b18e23':'#3cb4e623'}"><th style="padding:9px;white-space:nowrap">${step+1} · ${step%2?'Deskripsi':'Gambar'}</th>${schedule.map(route=>`<td style="padding:9px;font-weight:850">${names(n)[route[step]]}</td>`).join('')}</tr>`).join('')}<tr><th style="padding:9px">Reveal</th>${names(n).map(x=>`<td style="padding:9px">${x}</td>`).join('')}</tr></tbody></table></div>`}function routeList(route,n){return route.map((x,i)=>`<span class="pill" style="margin:4px">${i+1}. ${names(n)[x]}</span>`).join('')}function render(){if(!game){home();return}if(game.phase==='handoff')handoff();else if(game.phase==='reveal')reveal();else action()}function home(){app.innerHTML=`<section class="card hero"><span class="eyebrow">Offline · 2–8 pemain · oper HP sungguhan</span><h1>Telepon Gambar</h1><p>Tulis → gambar → tebak → oper. Pilih oper berurutan atau jadwal acak yang ditulis di kertas.</p></section><section class="card"><h2>1. Pilih jumlah pemain</h2><label for="count">Berapa pemain?</label><select id="count" style="width:100%;padding:13px;border-radius:14px;background:var(--field,#f6f9fd);color:var(--ink,#001f4f);border:2px solid #95959570">${Array.from({length:7},(_,i)=>`<option value="${i+2}" ${i===2?'selected':''}>${i+2} pemain</option>`).join('')}</select><p>Pemain diberi huruf A, B, C, dan seterusnya.</p></section><section class="card"><h2>2. Pilih cara oper</h2><div class="row"><button class="btn" id="original">➡️ Original · berurutan</button><button class="btn pink" id="random">🎲 Acak · pakai kertas</button></div><p class="small muted">Pilih mode yang sama di semua HP. Mode acak: satu HP menampilkan tabel, pemain utama menyalinnya ke kertas. HP lainnya langsung memilih pemainnya.</p></section><p class="footer">Tanpa akun, kode, ruang, atau koneksi antarpiranti.</p>`;document.getElementById('original').onclick=()=>setup(+document.getElementById('count').value,'original',null);document.getElementById('random').onclick=()=>randomChoice(+document.getElementById('count').value)}function randomChoice(n){app.innerHTML=`<section class="card"><span class="eyebrow">Mode acak · ${n} pemain</span><h1>Siapa memegang jadwal?</h1><p>Di satu HP utama, acak jadwal lalu <b>tuliskan tabelnya di kertas</b>. Semua HP lain cukup memilih pemiliknya. Saat bermain, ikuti kertas untuk memutuskan penerima berikutnya.</p><div class="row"><button class="btn pink" id="host">🎲 HP utama: acak jadwal</button><button class="btn secondary" id="other">HP lain: langsung siap</button></div><p><button class="btn secondary" id="back">← Kembali</button></p></section>`;document.getElementById('host').onclick=()=>setup(n,'random',makeSchedule(n));document.getElementById('other').onclick=()=>setup(n,'random',null);document.getElementById('back').onclick=home}function setup(n,mode,schedule){let owner=0;const draw=()=>{app.innerHTML=`<section class="card"><span class="eyebrow">${mode==='random'?'Mode acak':'Mode original'} · ${n} pemain</span><h1>${schedule?'Tulis jadwal ke kertas':'Siapkan HP ini'}</h1>${schedule?`<p>Salin tabel ke kertas sebelum bermain. Huruf di setiap sel adalah pemain yang memegang HP pada giliran itu.</p>${chart(schedule,n)}<p><button class="btn secondary" id="reroll">↻ Acak ulang tabel</button></p>`:mode==='random'?'<p>Ikuti jadwal di kertas yang ditulis pemain utama. Aplikasi akan mengatakan “Lempar ke pemain selanjutnya” tanpa menyebut nama.</p>':'<p>Oper HP mengikuti urutan A → B → C → … → A. Setiap HP dimulai di tangan pemiliknya.</p>'}<h2>HP ini milik pemain</h2><div class="row" id="owners">${names(n).map((x,i)=>`<button class="btn ${owner===i?'':'secondary'} compact" data-owner="${i}">${x}</button>`).join('')}</div><p class="warning small">Pastikan jumlah pemain dan mode sama di semua HP.${schedule?' Jadwal sudah disalin ke kertas sebelum mulai.':''}</p><button class="btn pink" id="start">Mulai menulis →</button></section>`;document.querySelectorAll('[data-owner]').forEach(b=>b.onclick=()=>{owner=+b.dataset.owner;draw()});if(schedule)document.getElementById('reroll').onclick=()=>{schedule=makeSchedule(n);draw()};document.getElementById('start').onclick=()=>{game={n,owner,mode,schedule,entries:[],phase:'action'};save();render()}};draw()}function currentAuthor(i){return game.mode==='original'?names(game.n)[(game.owner+i)%game.n]:i===0?names(game.n)[game.owner]:`Giliran ${i+1}`}function label(i){return i===0?'Deskripsi awal':i%2?'Gambar':'Deskripsi gambar'}function action(){let i=game.entries.length;if(i>=game.n){game.phase='reveal';save();reveal();return}let prev=game.entries[i-1],drawing=i%2===1;app.innerHTML=`<section class="card"><span class="eyebrow">HP ${names(game.n)[game.owner]} · giliran ${i+1}/${game.n}</span><h2>${drawing?'🎨 Gambar':'✍️ Tulis deskripsi'}</h2><p>${game.mode==='original'?`Sekarang dipegang pemain <b>${currentAuthor(i)}</b>. `:''}${i===0?'Tulis kalimat awal yang seru.':drawing?'Gambar hanya berdasarkan kalimat terakhir.':'Jelaskan gambar terakhir dengan kalimatmu sendiri.'}</p>${prev?`<div class="stage"><small>ENTRI TERAKHIR</small>${prev.type==='text'?`<div class="words">${esc(prev.value)}</div>`:`<img src="${prev.value}" alt="Gambar sebelumnya">`}</div>`:''}${drawing?`<div class="tools"><button class="swatch active" data-color="#001F4F" style="background:#001F4F" aria-label="Biru tua"></button><button class="swatch" data-color="#F05696" style="background:#F05696" aria-label="Merah muda"></button><button class="swatch" data-color="#32B18E" style="background:#32B18E" aria-label="Hijau"></button><button class="swatch" data-color="#FF8040" style="background:#FF8040" aria-label="Oranye"></button><button class="swatch" data-color="#3CB4E6" style="background:#3CB4E6" aria-label="Biru"></button><button id="eraser">Penghapus</button><button id="undo">↶ Urungkan</button><button id="clear">Hapus semua</button></div><div class="canvas-wrap"><canvas id="pad" width="720" height="720" aria-label="Kanvas menggambar dengan jari"></canvas></div>`:`<label for="words">${i===0?'Kalimat awal':'Apa yang kamu lihat?'}</label><textarea id="words" maxlength="220" placeholder="${i===0?'Seekor kucing menjadi koki di bulan…':'Seekor … sedang …'}"></textarea>`}<p id="action-error" class="error" role="alert"></p><button class="btn pink" id="submit">Kunci & oper →</button></section>`;if(drawing)initCanvas();document.getElementById('submit').onclick=()=>{let val=drawing?canvas.toDataURL('image/png'):document.getElementById('words').value.trim();if(drawing&&!history.length){document.getElementById('action-error').textContent='Buat sedikit gambar dahulu.';return}if(!drawing&&!val){document.getElementById('action-error').textContent='Tulis deskripsi dahulu.';return}game.entries.push({type:drawing?'image':'text',value:val,author:currentAuthor(i)});game.phase='handoff';if(!save()){game.entries.pop();game.phase='action';return}render()}}function initCanvas(){canvas=document.getElementById('pad');ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,720,720);history=[];color='#001F4F';let last=null;function point(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*720/r.width,y:(e.clientY-r.top)*720/r.height}}canvas.onpointerdown=e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);history.push(canvas.toDataURL());painting=true;last=point(e);ctx.beginPath();ctx.arc(last.x,last.y,color==='#ffffff'?17:3,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()};canvas.onpointermove=e=>{if(!painting)return;e.preventDefault();let p=point(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.strokeStyle=color;ctx.lineWidth=color==='#ffffff'?34:6;ctx.lineCap='round';ctx.stroke();last=p};canvas.onpointerup=canvas.onpointercancel=()=>{painting=false;last=null};document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color;document.querySelectorAll('.tools button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.getElementById('eraser').onclick=e=>{color='#ffffff';document.querySelectorAll('.tools button').forEach(x=>x.classList.remove('active'));e.currentTarget.classList.add('active')};document.getElementById('undo').onclick=()=>{let data=history.pop();if(!data)return;let img=new Image;img.onload=()=>ctx.drawImage(img,0,0);img.src=data};document.getElementById('clear').onclick=()=>{if(!confirm('Hapus seluruh gambar saat ini?'))return;history.push(canvas.toDataURL());ctx.fillStyle='#fff';ctx.fillRect(0,0,720,720)}}function handoff(){let finished=game.entries.length>=game.n;app.innerHTML=`<section class="card center"><span class="eyebrow">${finished?'Rantai selesai':'Giliran terkunci'}</span><h1>📱 ${finished?'Kembalikan ke pemilik':'Lempar ke pemain selanjutnya'}</h1><div class="stage big">${finished?`HP ${names(game.n)[game.owner]} kembali ke pemilik`:'Oper sekarang'}</div><p>${finished?'Buka bersama setelah semua HP selesai.':'Tunggu aba-aba bersama sebelum penerima membuka giliran.'}</p><button id="continue" class="btn">${finished?'Buka reveal →':'Saya penerima, lanjut →'}</button></section>`;document.getElementById('continue').onclick=()=>{game.phase=finished?'reveal':'action';save();render()}}function reveal(){let shown=0;const draw=()=>{app.innerHTML=`<section class="card"><span class="eyebrow">Buku pemain ${names(game.n)[game.owner]}</span><h1>🎉 Reveal Sequence</h1><p>Buka satu per satu untuk melihat perubahan cerita.</p>${game.entries.slice(0,shown).map((e,i)=>`<article class="reveal"><b>${i+1}. ${label(i)} · ${esc(e.author)}</b>${e.type==='image'?`<p><img src="${e.value}" alt="Gambar oleh ${esc(e.author)}"></p>`:`<p class="words">${esc(e.value)}</p>`}</article>`).join('')}<div class="row"><button class="btn" id="more" ${shown>=game.entries.length?'disabled':''}>${shown?'Buka berikutnya →':'Mulai reveal →'}</button><button class="btn secondary" id="all">Tampilkan semua</button></div><hr style="border:0;border-top:1px solid #95959555;margin:24px 0"><button class="btn secondary" id="again">Main lagi di HP ini</button></section>`;document.getElementById('more').onclick=()=>{shown++;draw()};document.getElementById('all').onclick=()=>{shown=game.entries.length;draw()};document.getElementById('again').onclick=()=>{if(!confirm('Mulai permainan baru? Rantai di HP ini akan dihapus.'))return;game=null;localStorage.removeItem(KEY);render()}};draw()}document.getElementById('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem(TKEY,document.body.classList.contains('dark')?'dark':'light');document.getElementById('theme').textContent=document.body.classList.contains('dark')?'☀ Mode terang':'☾ Mode gelap'};if(localStorage.getItem(TKEY)==='dark'){document.body.classList.add('dark');document.getElementById('theme').textContent='☀ Mode terang'}render()})();
</script></body></html>
