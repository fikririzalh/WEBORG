<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3efe8">
  <meta name="description" content="MIAW Order & Chaos — boardgame strategi 2 pemain dalam satu perangkat.">
  <title>MIAW · ORDER & CHAOS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true"><span>O</span><span>×</span></div>
        <div class="brand-copy">
          <div class="eyebrow" id="gameEyebrow">2 PLAYER ABSTRACT STRATEGY</div>
          <h1 id="gameTitle">ORDER & CHAOS</h1>
          <p id="gameSubtitle">Build the line. Break the pattern.</p>
        </div>
      </div>
      <div class="top-actions">
        <button id="themeBtn" class="icon-btn" type="button" aria-label="Ganti tema">🌙</button>
        <button id="soundBtn" class="icon-btn" type="button" aria-label="Aktif/nonaktif suara">🔊</button>
        <button id="resetBtn" class="secondary-btn" type="button">↻ Game Baru</button>
      </div>
    </header>

    <main id="app" aria-live="polite"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="core/platform.js"></script>
  <script src="core/turn-engine.js"></script>
  <script src="games/order-chaos.js"></script>
  <script src="app.js"></script>
</body>
</html>
