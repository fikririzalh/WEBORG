<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>weborg</title>

    <style>
        /* =========================================================
           TOKENS
        ========================================================= */
        :root {
            --bg: #ffffff;
            --bg-soft: #fafafa;
            --bg-mute: #efefef;
            --text: #141414;
            --muted: #737373;
            --line: #e6e6e6;
            --accent: #0a84ff;
            --accent-press: #0071e3;
            --danger: #e5264b;
            --star: #f5a623;
            --ring: linear-gradient(45deg, #f9ce34 0%, #ee2a7b 55%, #6228d7 100%);
            --radius: 14px;
            --header-h: 56px;
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", Roboto, system-ui, sans-serif;
            --ease: .18s ease;
        }

        body.dark {
            --bg: #0b0b0c;
            --bg-soft: #141415;
            --bg-mute: #1f1f21;
            --text: #f4f4f5;
            --muted: #8e8e93;
            --line: #26262a;
            --accent: #3d9bff;
            --accent-press: #1f87f5;
            --danger: #ff5a78;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            transition: background var(--ease), color var(--ease);
        }

        button, input, select, textarea { font: inherit; color: inherit; }
        button { cursor: pointer; border: 0; background: none; }
        a { color: inherit; text-decoration: none; }

        /* =========================================================
           PIN
        ========================================================= */
        #pin-overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: var(--bg);
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }

        .pin-card {
            width: 100%; max-width: 340px; text-align: center;
            padding: 36px 28px;
            border: 1px solid var(--line); border-radius: 22px;
            background: var(--bg);
        }

        .pin-ring { width: 76px; height: 76px; margin: 0 auto 18px; padding: 3px; border-radius: 50%; background: var(--ring); }
        .pin-ring span { width: 100%; height: 100%; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-size: 32px; border: 3px solid var(--bg); }

        .pin-card h2 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
        .pin-card p { margin: 6px 0 20px; font-size: 13px; color: var(--muted); }

        .pin-input {
            width: 100%; height: 46px; text-align: center;
            font-size: 22px; letter-spacing: 8px;
            border: 1px solid var(--line); border-radius: 12px;
            background: var(--bg-soft); outline: none; margin-bottom: 12px;
            transition: border-color var(--ease);
        }
        .pin-input:focus { border-color: var(--accent); }

        .pin-error { min-height: 16px; margin-top: 10px; font-size: 12px; font-weight: 600; color: var(--danger); }

        .app { display: none; }

        /* =========================================================
           BUTTONS
        ========================================================= */
        .btn {
            height: 34px; padding: 0 16px; border-radius: 10px;
            font-size: 13px; font-weight: 600;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            transition: background var(--ease), transform var(--ease);
        }
        .btn:active { transform: scale(.97); }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-press); }
        .btn-soft { background: var(--bg-mute); }
        .btn-soft:hover { background: var(--line); }
        .btn-block { width: 100%; height: 44px; font-size: 14px; border-radius: 12px; }

        .icon-btn {
            width: 38px; height: 38px; border-radius: 50%;
            display: grid; place-items: center; font-size: 19px;
            transition: background var(--ease);
        }
        .icon-btn:hover { background: var(--bg-mute); }

        /* =========================================================
           HEADER
        ========================================================= */
        .header {
            position: sticky; top: 0; z-index: 40;
            height: var(--header-h);
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
        }
        .header-inner {
            max-width: 935px; height: 100%; margin: 0 auto; padding: 0 16px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .wordmark { font-size: 24px; font-weight: 700; letter-spacing: -.05em; }
        .wordmark i { font-style: normal; color: var(--accent); }
        .header-actions { display: flex; align-items: center; gap: 2px; }

        /* =========================================================
           LAYOUT
        ========================================================= */
        .wrap { max-width: 935px; margin: 0 auto; padding: 0 16px 64px; }

        /* =========================================================
           PROFILE
        ========================================================= */
        .profile { display: flex; align-items: center; gap: 56px; padding: 32px 0 22px; }

        .avatar { flex: none; width: 150px; height: 150px; padding: 4px; border-radius: 50%; background: var(--ring); }
        .avatar span { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; font-size: 66px; background: var(--bg-soft); border: 5px solid var(--bg); }

        .profile-info { min-width: 0; flex: 1; }
        .profile-top { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 12px; margin-bottom: 18px; }
        .profile-top h1 { font-size: 20px; font-weight: 500; margin-right: 6px; }

        .stats { display: flex; gap: 36px; margin-bottom: 16px; font-size: 15px; }
        .stats b { font-weight: 700; }
        .stats span { color: var(--text); }

        .bio { font-size: 14px; line-height: 1.5; color: var(--text); }
        .bio small { display: block; color: var(--muted); font-size: 13px; }

        /* =========================================================
           HIGHLIGHTS
        ========================================================= */
        .highlights { display: flex; gap: 20px; overflow-x: auto; padding: 6px 2px 20px; scrollbar-width: none; }
        .highlights::-webkit-scrollbar { display: none; }
        .highlights:empty { display: none; }

        .hl { flex: none; width: 74px; text-align: center; }
        .hl-ring { width: 68px; height: 68px; margin: 0 auto; padding: 2.5px; border-radius: 50%; background: var(--ring); transition: transform var(--ease); }
        .hl:hover .hl-ring { transform: scale(1.06); }
        .hl-in { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; font-size: 28px; border: 3px solid var(--bg); background: hsl(var(--h) 70% 94%); }
        body.dark .hl-in { background: hsl(var(--h) 25% 17%); }
        .hl-name { display: block; margin-top: 7px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* =========================================================
           NAV (tabs + A–Z)
        ========================================================= */
        .nav {
            position: sticky; top: var(--header-h); z-index: 30;
            background: var(--bg);
            border-top: 1px solid var(--line);
        }
        .tabs { display: flex; justify-content: center; gap: 48px; }
        .tab {
            height: 46px; padding: 0 4px; margin-top: -1px;
            display: inline-flex; align-items: center; gap: 7px;
            font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
            color: var(--muted); border-top: 1px solid transparent;
            transition: color var(--ease);
        }
        .tab em { font-style: normal; font-size: 11px; font-weight: 500; opacity: .75; letter-spacing: 0; }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--text); border-top-color: var(--text); }

        .az {
            display: flex; gap: 2px; overflow-x: auto; padding: 6px 0 8px;
            border-bottom: 1px solid var(--line); scrollbar-width: none;
        }
        .az::-webkit-scrollbar { display: none; }
        .az button {
            flex: none; min-width: 26px; height: 26px; padding: 0 5px; border-radius: 8px;
            font-size: 12px; font-weight: 600; color: var(--text);
            transition: background var(--ease);
        }
        .az button:hover { background: var(--bg-mute); }
        .az button:disabled { color: var(--muted); opacity: .35; cursor: default; background: none; }

        /* =========================================================
           TOOLS ROW
        ========================================================= */
        .tools { display: grid; grid-template-columns: 1fr 180px; gap: 10px; padding: 16px 0 4px; }
        .field {
            width: 100%; height: 40px; padding: 0 14px;
            background: var(--bg-mute); border: 1px solid transparent; border-radius: 10px;
            outline: none; font-size: 14px;
            transition: border-color var(--ease), background var(--ease);
        }
        .field::placeholder { color: var(--muted); }
        .field:focus { border-color: var(--accent); background: var(--bg); }
        select.field { appearance: none; -webkit-appearance: none; cursor: pointer; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 17px) 17px, calc(100% - 12px) 17px; background-size: 5px 5px; background-repeat: no-repeat; }

        .section-head { padding: 22px 0 2px; }
        .section-head h2 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
        .section-head p { margin-top: 2px; font-size: 13px; color: var(--muted); }

        /* =========================================================
           LETTER GROUPS + GRID
        ========================================================= */
        .letter {
            display: flex; align-items: baseline; gap: 12px;
            padding: 26px 0 12px; scroll-margin-top: 150px;
        }
        .letter b { font-size: 26px; font-weight: 700; letter-spacing: -.04em; line-height: 1; }
        .letter i { flex: 1; height: 1px; background: var(--line); align-self: center; }
        .letter em { font-style: normal; font-size: 12px; color: var(--muted); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px 14px; }

        .tile { position: relative; min-width: 0; }
        .tile-link { display: block; }

        .thumb {
            aspect-ratio: 1; border-radius: var(--radius);
            display: grid; place-items: center;
            font-size: clamp(38px, 6vw, 54px);
            background: hsl(var(--h) 70% 95%);
            transition: transform var(--ease), box-shadow var(--ease);
        }
        body.dark .thumb { background: hsl(var(--h) 22% 15%); }
        .tile-link:hover .thumb { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0, 0, 0, .09); }
        .tile-link:active .thumb { transform: scale(.98); }

        .tile-meta { padding: 9px 2px 0; }
        .tile-meta h3 {
            font-size: 13.5px; font-weight: 600; line-height: 1.3; letter-spacing: -.005em;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .tile-meta p { margin-top: 2px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .chip-btn {
            position: absolute; top: 8px; width: 30px; height: 30px; border-radius: 50%;
            display: grid; place-items: center; font-size: 15px; line-height: 1;
            background: rgba(255, 255, 255, .86); color: #333;
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            transition: opacity var(--ease), transform var(--ease);
        }
        body.dark .chip-btn { background: rgba(20, 20, 22, .78); color: #eee; }
        .chip-btn:active { transform: scale(.9); }
        .chip-btn.star { left: 8px; }
        .chip-btn.star.on { color: var(--star); }
        .chip-btn.more { right: 8px; font-weight: 700; letter-spacing: 1px; }

        @media (hover: hover) {
            .chip-btn { opacity: 0; }
            .tile:hover .chip-btn, .tile:focus-within .chip-btn, .chip-btn.star.on { opacity: 1; }
        }

        .empty { text-align: center; padding: 70px 20px; color: var(--muted); display: none; }
        .empty div { font-size: 44px; margin-bottom: 10px; }
        .empty h3 { color: var(--text); font-size: 16px; margin-bottom: 4px; }
        .empty p { font-size: 13px; }

        /* =========================================================
           DIALOGS
        ========================================================= */
        dialog {
            margin: auto; width: min(460px, calc(100% - 28px));
            border: 1px solid var(--line); border-radius: 18px; padding: 0;
            background: var(--bg); color: var(--text);
            box-shadow: 0 24px 80px rgba(0, 0, 0, .25);
        }
        dialog::backdrop { background: rgba(0, 0, 0, .5); backdrop-filter: blur(3px); }

        .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 14px 20px; border-bottom: 1px solid var(--line); }
        .modal-head h2 { font-size: 15px; font-weight: 700; }
        .modal-body { padding: 18px 20px; display: grid; gap: 14px; max-height: 70vh; overflow-y: auto; }
        .modal-foot { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); }
        .modal-foot .btn { flex: 1; height: 40px; }

        .fg { display: grid; gap: 6px; }
        .fg label { font-size: 12px; font-weight: 600; color: var(--muted); }
        .fg .field, textarea.field { height: 42px; background: var(--bg-soft); border: 1px solid var(--line); }
        textarea.field { height: 76px; padding: 10px 14px; resize: vertical; }
        .fg .field:focus, textarea.field:focus { border-color: var(--accent); background: var(--bg); }
        .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .check { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 500; cursor: pointer; }
        .check input { width: 17px; height: 17px; accent-color: var(--accent); }

        .sheet { width: min(340px, calc(100% - 28px)); border-radius: 16px; overflow: hidden; }
        .sheet-title { padding: 16px 18px 12px; text-align: center; border-bottom: 1px solid var(--line); }
        .sheet-title b { display: block; font-size: 14px; font-weight: 700; }
        .sheet-title span { font-size: 12px; color: var(--muted); }
        .sheet button.item { display: block; width: 100%; padding: 15px 18px; font-size: 14px; text-align: center; border-bottom: 1px solid var(--line); transition: background var(--ease); }
        .sheet button.item:last-child { border-bottom: 0; }
        .sheet button.item:hover { background: var(--bg-mute); }
        .sheet button.item.danger { color: var(--danger); font-weight: 700; }

        /* =========================================================
           TOAST
        ========================================================= */
        .toast {
            position: fixed; left: 50%; bottom: 24px; z-index: 100;
            transform: translate(-50%, 14px); opacity: 0; pointer-events: none;
            max-width: calc(100% - 32px); padding: 11px 18px; border-radius: 12px;
            background: var(--text); color: var(--bg);
            font-size: 13px; font-weight: 600;
            transition: .22s ease;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        /* =========================================================
           RESPONSIVE
        ========================================================= */
        @media (max-width: 720px) {
            .wrap { padding: 0 14px 56px; }
            .profile { gap: 22px; padding: 20px 0 14px; align-items: flex-start; flex-wrap: wrap; }
            .avatar { width: 84px; height: 84px; padding: 3px; }
            .avatar span { font-size: 38px; border-width: 3px; }
            .profile-info { display: contents; }
            .profile-top { flex: 1; min-width: 0; margin-bottom: 0; align-self: center; flex-direction: column; align-items: flex-start; gap: 10px; }
            .profile-top h1 { font-size: 18px; margin: 0; }
            .stats { order: 3; width: 100%; justify-content: space-around; gap: 0; margin: 4px 0 0; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 13px; text-align: center; }
            .stats span { display: flex; flex-direction: column; color: var(--muted); }
            .stats b { color: var(--text); font-size: 15px; }
            .bio { order: 2; width: 100%; }
            .tabs { gap: 0; justify-content: space-around; }
            .tab { font-size: 11px; letter-spacing: .06em; }
            .tools { grid-template-columns: 1fr; }
            .grid { grid-template-columns: repeat(3, 1fr); gap: 14px 8px; }
            .thumb { border-radius: 12px; font-size: 34px; }
            .tile-meta h3 { font-size: 12px; }
            .tile-meta p { font-size: 11px; }
            .chip-btn { width: 26px; height: 26px; font-size: 13px; top: 5px; }
            .chip-btn.star { left: 5px; }
            .chip-btn.more { right: 5px; }
            .highlights { gap: 14px; }
            .letter { scroll-margin-top: 140px; }
            .row2 { grid-template-columns: 1fr; }
        }

        @media (max-width: 360px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; scroll-behavior: auto !important; }
        }
    </style>
</head>

<body>

    <!-- PIN -->
    <div id="pin-overlay">
        <div class="pin-card">
            <div class="pin-ring"><span>🐾</span></div>
            <h2>weborg</h2>
            <p>Masukkan PIN untuk membuka.</p>
            <input type="password" id="pinInput" class="pin-input" placeholder="••••" maxlength="8" autocomplete="off">
            <button class="btn btn-primary btn-block" id="pinSubmit">Buka</button>
            <div id="pinError" class="pin-error"></div>
        </div>
    </div>

    <div class="app" id="appContent">

        <header class="header">
            <div class="header-inner">
                <div class="wordmark">weborg<i>.</i></div>
                <div class="header-actions">
                    <button class="icon-btn" id="addTop" title="Tambah project" aria-label="Tambah project">＋</button>
                    <button class="icon-btn" id="themeToggle" title="Mode gelap / terang" aria-label="Ganti tema">🌙</button>
                    <button class="icon-btn" id="lockBtn" title="Kunci" aria-label="Kunci">🔒</button>
                </div>
            </div>
        </header>

        <div class="wrap">

            <!-- PROFILE -->
            <section class="profile">
                <div class="avatar"><span>🐱</span></div>

                <div class="profile-info">
                    <div class="profile-top">
                        <h1>weborg</h1>
                        <div style="display:flex;gap:8px;flex-wrap:wrap">
                            <button class="btn btn-primary" id="heroAdd">Tambah project</button>
                            <button class="btn btn-soft" id="resetBtn">Reset</button>
                        </div>
                    </div>

                    <div class="stats">
                        <span><b id="statProjects">0</b> project</span>
                        <span><b id="statFav">0</b> favorit</span>
                        <span><b id="statCats">0</b> kategori</span>
                    </div>

                    <div class="bio">
                        Semua project dalam satu tempat.
                        <small>Urut A–Z · game dan belajar dipisah</small>
                    </div>
                </div>
            </section>

            <!-- HIGHLIGHTS = FAVORIT -->
            <div class="highlights" id="highlights"></div>

            <!-- TABS + A-Z -->
            <nav class="nav">
                <div class="tabs" id="tabs">
                    <button class="tab active" data-tab="game">Game <em id="cntGame">0</em></button>
                    <button class="tab" data-tab="belajar">Belajar <em id="cntBelajar">0</em></button>
                    <button class="tab" data-tab="tools">Tools <em id="cntTools">0</em></button>
                </div>
                <div class="az" id="azStrip"></div>
            </nav>

            <!-- SEARCH -->
            <div class="tools">
                <input type="search" id="searchInput" class="field" placeholder="Cari project…  ( / )" autocomplete="off">
                <select id="categoryFilter" class="field" aria-label="Kategori">
                    <option value="all">Semua kategori</option>
                </select>
            </div>

            <div class="section-head" id="sectionHead"></div>

            <div id="groups"></div>

            <div class="empty" id="emptyState">
                <div>🫥</div>
                <h3>Tidak ada project</h3>
                <p>Ubah pencarian atau tambahkan project baru.</p>
            </div>

        </div>
    </div>

    <!-- FORM -->
    <dialog id="projectDialog">
        <form id="projectForm">
            <div class="modal-head">
                <h2 id="dialogTitle">Tambah project</h2>
                <button type="button" class="icon-btn" id="closeDialog" aria-label="Tutup">✕</button>
            </div>

            <div class="modal-body">
                <input type="hidden" id="projectId">

                <div class="fg">
                    <label for="projectName">Nama</label>
                    <input class="field" id="projectName" required maxlength="60" placeholder="Contoh: Gacha Kartu">
                </div>

                <div class="fg">
                    <label for="projectUrl">Link / path</label>
                    <input class="field" id="projectUrl" required placeholder="gacha-kartu-pribadi/index.html">
                </div>

                <div class="row2">
                    <div class="fg">
                        <label for="projectCategory">Kategori</label>
                        <input class="field" id="projectCategory" maxlength="40" placeholder="Game, Study, Timer…">
                    </div>
                    <div class="fg">
                        <label for="projectIcon">Emoji</label>
                        <input class="field" id="projectIcon" maxlength="4" placeholder="🐱">
                    </div>
                </div>

                <div class="fg">
                    <label for="projectSection">Section</label>
                    <select class="field" id="projectSection">
                        <option value="auto">Otomatis</option>
                        <option value="game">Game</option>
                        <option value="belajar">Belajar</option>
                        <option value="tools">Tools</option>
                    </select>
                </div>

                <div class="fg">
                    <label for="projectDescription">Deskripsi</label>
                    <textarea class="field" id="projectDescription" maxlength="180" placeholder="Deskripsi singkat…"></textarea>
                </div>

                <label class="check">
                    <input type="checkbox" id="projectFavorite"> Tandai sebagai favorit
                </label>
            </div>

            <div class="modal-foot">
                <button type="button" class="btn btn-soft" id="cancelDialog">Batal</button>
                <button type="submit" class="btn btn-primary">Simpan</button>
            </div>
        </form>
    </dialog>

    <!-- ACTION SHEET -->
    <dialog id="sheet" class="sheet">
        <div class="sheet-title"><b id="sheetName"></b><span id="sheetCat"></span></div>
        <button class="item" id="sheetEdit">Edit</button>
        <button class="item" id="sheetFav">Favorit</button>
        <button class="item danger" id="sheetDelete">Hapus</button>
        <button class="item" id="sheetCancel">Batal</button>
    </dialog>

    <div class="toast" id="toast"></div>

    <script>
        /* =========================================================
           PIN
        ========================================================= */
        const MASTER_PIN = "123456"; // <-- GANTI PIN ANDA DI SINI

        const pinOverlay = document.getElementById("pin-overlay");
        const appContent = document.getElementById("appContent");
        const pinInput = document.getElementById("pinInput");
        const pinError = document.getElementById("pinError");

        function verifyPin() {
            if (pinInput.value === MASTER_PIN) {
                sessionStorage.setItem("hub_authenticated", "true");
                unlockDashboard();
            } else {
                pinError.textContent = "PIN salah. Coba lagi.";
                pinInput.value = "";
            }
        }

        function unlockDashboard() {
            pinOverlay.style.display = "none";
            appContent.style.display = "block";
            pinError.textContent = "";
            pinInput.value = "";
        }

        function lockDashboard() {
            sessionStorage.removeItem("hub_authenticated");

        const STORAGE_KEY = "weborg-hub-v5";

        const HIDDEN_KEY = "weborg-hub-hidden";
        const THEME_KEY = "my-project-hub-theme";

        const readJSON = (key, fallback) => {
            try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; }
            catch (e) { return fallback; }
        };

        let hidden = readJSON(HIDDEN_KEY, []);
        if (!Array.isArray(hidden)) hidden = [];

        function loadProjects() {
            const defaults = DEFAULT_PROJECTS.map(p => ({ ...p }));
            let stored = readJSON(STORAGE_KEY, null);

            if (!Array.isArray(stored)) {
                let legacy = readJSON(LEGACY_KEY, []);
                if (!Array.isArray(legacy)) legacy = [];
                legacy = legacy.filter(p => p && p.id);

                const merged = defaults.map(d => {
                    const old = legacy.find(x => x.id === d.id);
                    return old ? { ...d, favorite: !!old.favorite } : d;
                });
                const custom = legacy.filter(p => p.name && p.url && !defaults.some(d => d.id === p.id));
                const result = [...custom, ...merged];
                localStorage.setItem(STORAGE_KEY, JSON.stringify(result));
                return result.filter(p => !hidden.includes(p.id));
            }

            stored = stored.filter(p => p && p.id);
            const mergedDefaults = defaults.map(d => ({ ...d, ...(stored.find(s => s.id === d.id) || {}) }));
            const custom = stored.filter(p => !defaults.some(d => d.id === p.id));
            return [...custom, ...mergedDefaults].filter(p => !hidden.includes(p.id));
        }

        const SECTIONS = {

        const TOOL_CATS = ["timer", "tools", "app", "cozy", "produktivitas"];

        function sectionOf(p) {
            if (p.section && SECTIONS[p.section]) return p.section;
            if (BOOK_ICONS.includes((p.icon || "").trim())) return "belajar";
            const c = (p.category || "").trim().toLowerCase();
            if (c === "study") return "belajar";
            if (TOOL_CATS.includes(c)) return "tools";
            return "game";
        }

        // Nama tampilan: buang kata "miaw", rapikan separator, huruf awal kapital
        function displayName(p) {
            const original = String(p.name || p.id || "").trim();
            let n = original;
            if (!/\s/.test(n)) n = n.replace(/[-_]+/g, " ");
            n = n.replace(/famiaw/gi, "Family").replace(/miaw/gi, " ");
            n = n.replace(/\s+/g, " ").trim();
            if (!n) n = original;
            return n.split(" ").map(w => w ? w[0].toUpperCase() + w.slice(1) : w).join(" ");
        }

        function cleanDesc(p) {
            const d = (p.description || "").trim();
            return d === "." ? "" : d;
        }

        const HUES = [210, 195, 165, 145, 45, 20, 350, 320, 280, 250];
        function hueOf(id) {
            let h = 0;
            for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
            return HUES[h % HUES.length];
        }

        function escapeHtml(v) {
            return String(v)
                .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
        }

        function isValidProjectUrl(url) {
            const c = url.trim().toLowerCase();
            return !!c && !c.startsWith("javascript:") && !c.startsWith("data:") && !c.startsWith("vbscript:");
        }

        const collator = new Intl.Collator("id", { numeric: true, sensitivity: "base" });
        const byName = (a, b) => collator.compare(displayName(a), displayName(b));

        function letterOf(p) {
            const ch = displayName(p).charAt(0).toUpperCase();
            return /[A-Z]/.test(ch) ? ch : "#";
        }

        function plural(n, word) { return `${n} ${word}`; }

            const cats = [...new Set(base.map(p => p.category || "Project"))].sort(collator.compare);

            categoryFilter.innerHTML = `<option value="all">Semua kategori</option>` +
                cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");

            categoryFilter.value = cats.includes(current) ? current : "all";
        }

        function tileHTML(p) {
            const id = escapeHtml(p.id);
            const name = escapeHtml(displayName(p));
            const desc = cleanDesc(p);
            return `
            <article class="tile" style="--h:${hueOf(p.id)}">
                <a class="tile-link" href="${escapeHtml(p.url)}" title="${escapeHtml(desc ? displayName(p) + " — " + desc : displayName(p))}">
                    <div class="thumb"><span>${escapeHtml(p.icon || "🐱")}</span></div>
                    <div class="tile-meta">
                        <h3>${name}</h3>
                        <p>${escapeHtml(p.category || "Project")}</p>
                    </div>
                </a>
                <button class="chip-btn star ${p.favorite ? "on" : ""}" data-action="favorite" data-id="${id}" aria-label="Favorit">${p.favorite ? "★" : "☆"}</button>
                <button class="chip-btn more" data-action="more" data-id="${id}" aria-label="Opsi">···</button>
            </article>`;
        }

        function renderHighlights() {
            const favs = projects.filter(p => p.favorite).sort(byName);
            highlightsEl.innerHTML = favs.map(p => `
                <a class="hl" href="${escapeHtml(p.url)}" style="--h:${hueOf(p.id)}" title="${escapeHtml(displayName(p))}">
                    <div class="hl-ring"><div class="hl-in">${escapeHtml(p.icon || "🐱")}</div></div>
                    <span class="hl-name">${escapeHtml(displayName(p))}</span>
                </a>`).join("");
        }

        function render() {
            const base = getBase();
            renderCategories(base);

            const cat = categoryFilter.value;
            const list = base.filter(p => cat === "all" || (p.category || "Project") === cat).sort(byName);

            // group A–Z
            const groups = new Map();
            list.forEach(p => {
                const l = letterOf(p);
                if (!groups.has(l)) groups.set(l, []);
                groups.get(l).push(p);
            });

            const order = ["#", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];
            groupsEl.innerHTML = order.filter(l => groups.has(l)).map(l => `
                <section>
                    <div class="letter" id="L-${l === "#" ? "num" : l}">
                        <b>${l}</b><i></i><em>${groups.get(l).length}</em>
                    </div>
                    <div class="grid">${groups.get(l).map(tileHTML).join("")}</div>
                </section>`).join("");

            // A–Z strip
            azEl.innerHTML = order
                .filter(l => l !== "#" || groups.has("#"))
                .map(l => `<button data-letter="${l === "#" ? "num" : l}" ${groups.has(l) ? "" : "disabled"}>${l}</button>`)
                .join("");

            // section heading
            const kw = searchInput.value.trim();
            if (kw) {
                sectionHead.innerHTML = `<h2>Hasil untuk “${escapeHtml(kw)}”</h2><p>${plural(list.length, "project")} di semua section</p>`;
            } else {
                const s = SECTIONS[activeTab];
                sectionHead.innerHTML = `<h2>${s.title}</h2><p>${s.desc}</p>`;
            }

            emptyEl.style.display = list.length ? "none" : "block";

            // tabs + counts
            document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", !kw && t.dataset.tab === activeTab));
            const counts = { game: 0, belajar: 0, tools: 0 };
            projects.forEach(p => counts[sectionOf(p)]++);
            $("cntGame").textContent = counts.game;
            $("cntBelajar").textContent = counts.belajar;
            $("cntTools").textContent = counts.tools;

            // stats
            $("statProjects").textContent = projects.length;
            $("statFav").textContent = projects.filter(p => p.favorite).length;
            $("statCats").textContent = new Set(projects.map(p => p.category || "Project")).size;

            renderHighlights();
        }


        /* =========================================================
           EVENTS
        ========================================================= */
        $("tabs").addEventListener("click", e => {
            const tab = e.target.closest(".tab");
            if (!tab) return;
            activeTab = tab.dataset.tab;
            searchInput.value = "";
            categoryFilter.value = "all";
            render();
            window.scrollTo({ top: Math.max(0, document.querySelector(".nav").offsetTop - 56), behavior: "smooth" });
        });

        azEl.addEventListener("click", e => {
            const b = e.target.closest("button[data-letter]");
            if (!b || b.disabled) return;
            const target = document.getElementById("L-" + b.dataset.letter);
            if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
        });

        searchInput.addEventListener("input", render);
        categoryFilter.addEventListener("change", render);

        document.addEventListener("keydown", e => {
            if (e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && appContent.style.display === "block") {
                e.preventDefault();
                searchInput.focus();
            }
        });

        // tile actions
        groupsEl.addEventListener("click", e => {
            const btn = e.target.closest("[data-action]");
            if (!btn) return;
            e.preventDefault();
            const id = btn.dataset.id;

            if (btn.dataset.action === "favorite") toggleFavorite(id);
            if (btn.dataset.action === "more") openSheet(id);
        });

        function toggleFavorite(id) {
            projects = projects.map(p => p.id === id ? { ...p, favorite: !p.favorite } : p);
            saveProjects();
            render();
        }

        /* ---------- action sheet ---------- */
        function openSheet(id) {
            const p = projects.find(x => x.id === id);
            if (!p) return;
            sheetId = id;
            $("sheetName").textContent = displayName(p);
            $("sheetCat").textContent = `${p.category || "Project"} · ${SECTIONS[sectionOf(p)].label}`;
            $("sheetFav").textContent = p.favorite ? "Hapus dari favorit" : "Tandai favorit";
            sheet.showModal();
        }

        $("sheetCancel").addEventListener("click", () => sheet.close());
        sheet.addEventListener("click", e => { if (e.target === sheet) sheet.close(); });

        $("sheetFav").addEventListener("click", () => {
            sheet.close();
            toggleFavorite(sheetId);
        });

        $("sheetEdit").addEventListener("click", () => {
            sheet.close();
            openEditDialog(sheetId);
        });

        $("sheetDelete").addEventListener("click", () => {
            const p = projects.find(x => x.id === sheetId);
            sheet.close();
            if (!p) return;
            if (!confirm(`Hapus "${displayName(p)}" dari dashboard?`)) return;

            if (DEFAULT_PROJECTS.some(d => d.id === p.id) && !hidden.includes(p.id)) hidden.push(p.id);
            projects = projects.filter(x => x.id !== p.id);
            saveProjects();
            render();
            showToast("Project dihapus");
        });

        /* ---------- form ---------- */
        function openAddDialog() {
            form.reset();
            $("projectId").value = "";
            $("projectIcon").value = "🐱";
            $("projectSection").value = "auto";
            $("projectCategory").value = activeTab === "belajar" ? "Study" : "";
            $("dialogTitle").textContent = "Tambah project";
            dialog.showModal();
        }

        function openEditDialog(id) {
            const p = projects.find(x => x.id === id);
            if (!p) return;
            $("projectId").value = p.id;
            $("projectName").value = p.name;
            $("projectUrl").value = p.url;
            $("projectCategory").value = p.category || "";
            $("projectIcon").value = p.icon || "";
            $("projectSection").value = p.section || "auto";
            $("projectDescription").value = cleanDesc(p);
            $("projectFavorite").checked = !!p.favorite;
            $("dialogTitle").textContent = "Edit project";
            dialog.showModal();
        }

        form.addEventListener("submit", e => {
            e.preventDefault();

            const name = $("projectName").value.trim();
            const url = $("projectUrl").value.trim().replaceAll("\\", "/");
            if (!name) return showToast("Nama wajib diisi");
            if (!isValidProjectUrl(url)) return showToast("Link tidak valid");

            const id = $("projectId").value;
            const section = $("projectSection").value;

            const data = {
                id: id || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
                name, url,
                category: $("projectCategory").value.trim() || "Project",
                icon: $("projectIcon").value.trim() || "🐱",
                description: $("projectDescription").value.trim(),
                favorite: $("projectFavorite").checked,
                ...(section !== "auto" ? { section } : {})
            };

            if (id) {
                projects = projects.map(p => p.id === id ? data : p);
                showToast("Project diperbarui");
            } else {
                projects.unshift(data);
                showToast("Project ditambahkan");
            }

            saveProjects();
            render();
            dialog.close();
        });

        ["addTop", "heroAdd"].forEach(id => $(id).addEventListener("click", openAddDialog));
        $("closeDialog").addEventListener("click", () => dialog.close());
        $("cancelDialog").addEventListener("click", () => dialog.close());
        dialog.addEventListener("click", e => { if (e.target === dialog) dialog.close(); });

        /* ---------- reset ---------- */
        $("resetBtn").addEventListener("click", () => {
            if (!confirm("Kembalikan seluruh daftar project ke data awal?")) return;
            hidden = [];
            projects = DEFAULT_PROJECTS.map(p => ({ ...p }));
            saveProjects();
            activeTab = "game";
            searchInput.value = "";
            categoryFilter.value = "all";
            render();
            showToast("Daftar di-reset");
        });


        /* =========================================================
           THEME
        ========================================================= */
        function applyTheme(theme) {
            const dark = theme === "dark";
            document.body.classList.toggle("dark", dark);
            themeToggle.textContent = dark ? "☀️" : "🌙";
            document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#0b0b0c" : "#ffffff");
        }

        const savedTheme = localStorage.getItem(THEME_KEY);
        applyTheme(savedTheme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

        themeToggle.addEventListener("click", () => {
            const next = document.body.classList.contains("dark") ? "light" : "dark";
            localStorage.setItem(THEME_KEY, next);
            applyTheme(next);
        });


        /* =========================================================
           TOAST
        ========================================================= */
        let toastTimer;
        function showToast(msg) {
            clearTimeout(toastTimer);
            toastEl.textContent = msg;
            toastEl.classList.add("show");
            toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
        }


        /* =========================================================
           INIT
        ========================================================= */
        render();
    </script>

</body>

</html>
