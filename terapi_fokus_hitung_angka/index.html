<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan Fokus — Hitung Angka</title>
<style>
  :root{
    --bg1:#1b1035;
    --bg2:#2b1055;
    --card:#241645;
    --accent:#ff6b6b;
    --accent2:#ffd93d;
    --text:#f4f1ff;
    --muted:#b6a9d9;
    --good:#4ade80;
    --bad:#ff6b6b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Segoe UI', Tahoma, Verdana, sans-serif;
    background:radial-gradient(circle at top, var(--bg2), var(--bg1));
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .wrap{
    max-width:560px;
    width:100%;
  }
  .title{
    text-align:center;
    margin-bottom:4px;
  }
  .title h1{
    font-size:1.6rem;
    margin:0;
    background:linear-gradient(90deg, var(--accent2), var(--accent));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .title p{
    color:var(--muted);
    font-size:.85rem;
    margin:6px 0 20px;
    text-align:center;
  }
  .card{
    background:var(--card);
    border-radius:20px;
    padding:24px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
    border:1px solid rgba(255,255,255,.06);
  }
  .stats{
    display:flex;
    justify-content:space-between;
    margin-bottom:16px;
    font-size:.85rem;
    color:var(--muted);
  }
  .stats b{
    color:var(--accent2);
    font-size:1rem;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:8px;
    background:#150c2b;
    padding:16px;
    border-radius:14px;
    margin-bottom:18px;
    user-select:none;
  }
  .cell{
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.3rem;
    font-weight:700;
    border-radius:10px;
    background:#1f1440;
    color:var(--text);
    transition:transform .15s;
  }
  .cell.zero{
    color:var(--accent2);
  }
  .warn{
    text-align:center;
    font-size:.75rem;
    color:var(--muted);
    margin-bottom:16px;
    line-height:1.5;
  }
  .warn b{ color:var(--accent);}
  .answer-row{
    display:flex;
    gap:10px;
    margin-bottom:14px;
  }
  input#guess{
    flex:1;
    padding:12px 14px;
    border-radius:12px;
    border:2px solid rgba(255,255,255,.08);
    background:#150c2b;
    color:var(--text);
    font-size:1.1rem;
    text-align:center;
    outline:none;
  }
  input#guess:focus{
    border-color:var(--accent2);
  }
  button{
    border:none;
    border-radius:12px;
    padding:12px 20px;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    transition:transform .1s, opacity .2s;
  }
  button:active{ transform:scale(.96); }
  #submit{
    background:linear-gradient(90deg, var(--accent2), var(--accent));
    color:#1b1035;
  }
  #newGame{
    width:100%;
    background:transparent;
    color:var(--muted);
    border:1px solid rgba(255,255,255,.15);
  }
  #newGame:hover{ color:var(--text); border-color:var(--accent2); }
  #feedback{
    text-align:center;
    min-height:26px;
    font-weight:600;
    margin-bottom:10px;
  }
  #feedback.good{ color:var(--good); }
  #feedback.bad{ color:var(--bad); }
  .setup{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .diff-btn{
    background:#150c2b;
    color:var(--muted);
    border:1px solid rgba(255,255,255,.1);
    font-size:.8rem;
    padding:8px 14px;
  }
  .diff-btn.active{
    background:linear-gradient(90deg, var(--accent2), var(--accent));
    color:#1b1035;
    border-color:transparent;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">
    <h1>🎯 Latihan Fokus</h1>
    <p>Hitung ada berapa angka <b style="color:var(--accent2)">0</b> di dalam kotak — cukup pakai mata, jangan pakai jari!</p>
  </div>

  <div class="card">
    <div class="setup" id="diffButtons">
      <button class="diff-btn" data-level="easy">Mudah (16)</button>
      <button class="diff-btn active" data-level="medium">Sedang (24)</button>
      <button class="diff-btn" data-level="hard">Sulit (36)</button>
    </div>

    <div class="stats">
      <div>Skor: <b id="score">0</b></div>
      <div>Ronde: <b id="round">1</b></div>
      <div>Waktu: <b id="timer">--</b>s</div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="warn">Ingat: tidak boleh menunjuk satu-satu pakai jari <b>ya! 👀 Latih matamu untuk memindai (scan) seluruh kotak.</b></div>

    <div id="feedback"></div>

    <div class="answer-row">
      <input type="number" id="guess" placeholder="Berapa jumlah angka 0?" min="0">
      <button id="submit">Cek</button>
    </div>

    <button id="newGame">🔄 Angka Baru</button>
  </div>
</div>

<script>
  const gridEl = document.getElementById('grid');
  const scoreEl = document.getElementById('score');
  const roundEl = document.getElementById('round');
  const timerEl = document.getElementById('timer');
  const feedbackEl = document.getElementById('feedback');
  const guessInput = document.getElementById('guess');
  const submitBtn = document.getElementById('submit');
  const newGameBtn = document.getElementById('newGame');
  const diffButtons = document.querySelectorAll('.diff-btn');

  let score = 0;
  let round = 1;
  let zeroCount = 0;
  let startTime = null;
  let timerInterval = null;
  let currentLevel = 'medium';
  let locked = false;

  const levelSizes = { easy: 16, medium: 24, hard: 36 };
  const levelCols = { easy: 4, medium: 6, hard: 6 };

  function randDigit(){
    return Math.floor(Math.random() * 10);
  }

  function buildGrid(){
    const size = levelSizes[currentLevel];
    const cols = levelCols[currentLevel];
    gridEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    gridEl.innerHTML = '';
    zeroCount = 0;

    // pastikan minimal ada beberapa nol biar wajar
    const digits = [];
    for(let i=0;i<size;i++){
      digits.push(randDigit());
    }
    // pastikan proporsi nol tidak terlalu ekstrem (opsional biar seru)
    zeroCount = digits.filter(d => d === 0).length;

    digits.forEach(d=>{
      const cell = document.createElement('div');
      cell.className = 'cell' + (d===0 ? ' zero' : '');
      cell.textContent = d;
      gridEl.appendChild(cell);
    });
  }

  function startTimer(){
    stopTimer();
    startTime = Date.now();
    timerEl.textContent = '0';
    timerInterval = setInterval(()=>{
      const elapsed = ((Date.now()-startTime)/1000).toFixed(1);
      timerEl.textContent = elapsed;
    }, 100);
  }

  function stopTimer(){
    if(timerInterval) clearInterval(timerInterval);
  }

  function newRound(keepRound){
    locked = false;
    feedbackEl.textContent = '';
    feedbackEl.className = '';
    guessInput.value = '';
    guessInput.disabled = false;
    submitBtn.disabled = false;
    buildGrid();
    startTimer();
    guessInput.focus();
    if(!keepRound){
      round++;
      roundEl.textContent = round;
    }
  }

  function checkAnswer(){
    if(locked) return;
    const val = parseInt(guessInput.value, 10);
    if(isNaN(val)){
      feedbackEl.textContent = 'Isi dulu jawabannya ya 🙂';
      feedbackEl.className = '';
      return;
    }
    locked = true;
    stopTimer();
    guessInput.disabled = true;
    submitBtn.disabled = true;

    if(val === zeroCount){
      const timeTaken = parseFloat(timerEl.textContent);
      let gained = 10;
      if(timeTaken < 8) gained = 20;
      else if(timeTaken < 15) gained = 15;
      score += gained;
      scoreEl.textContent = score;
      feedbackEl.textContent = `✅ Benar! Ada ${zeroCount} angka 0. +${gained} poin (${timeTaken}s)`;
      feedbackEl.className = 'good';
    } else {
      feedbackEl.textContent = `❌ Kurang tepat. Jawaban sebenarnya: ${zeroCount}. Coba lagi ya!`;
      feedbackEl.className = 'bad';
    }

    setTimeout(()=>{
      newRound(false);
    }, 1600);
  }

  submitBtn.addEventListener('click', checkAnswer);
  guessInput.addEventListener('keydown', e=>{
    if(e.key === 'Enter') checkAnswer();
  });

  newGameBtn.addEventListener('click', ()=>{
    newRound(true);
  });

  diffButtons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      diffButtons.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentLevel = btn.dataset.level;
      score = 0;
      round = 1;
      scoreEl.textContent = score;
      roundEl.textContent = round;
      newRound(true);
    });
  });

  // init
  newRound(true);
</script>
</body>
</html>
