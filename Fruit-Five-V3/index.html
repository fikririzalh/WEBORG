<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11131a">
  <meta name="description" content="Fruit Five V3, permainan refleks buah untuk meja dan bel sungguhan.">
  <title>FRUIT FIVE V3</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true"><span>F</span><i>5</i></div>
        <div class="brand-copy">
          <div class="eyebrow" id="gameEyebrow">REAL-LIFE REFLEX GAME</div>
          <h1 id="gameTitle">FRUIT FIVE</h1>
          <p id="gameSubtitle">V3 · Lihat. Hitung. Bunyi.</p>
        </div>
      </div>
      <div class="top-actions">
        <button id="themeBtn" class="icon-btn" type="button" aria-label="Ganti tema">🌙</button>
        <button id="soundBtn" class="icon-btn" type="button" aria-label="Aktif/nonaktif suara">🔊</button>
        <button id="resetBtn" class="reset-btn" type="button" title="Langsung mulai ulang tanpa konfirmasi">↻ Ulang Instan</button>
      </div>
    </header>
    <main id="app"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Urutan pemuatan: platform -> engine -> game -> bootstrap. -->
  <script src="core/platform.js"></script>
  <script src="core/turn-engine.js"></script>
  <script src="games/fruit-five.js"></script>
  <script src="app.js"></script>
</body>
</html>
