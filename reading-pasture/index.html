<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#efe4c2" />
  <title>Reading Pasture · Lamb & Wolf</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="sky-decor" aria-hidden="true">
    <div class="sunmoon"></div><div class="cloud c1"></div><div class="cloud c2"></div>
    <div class="hill h1"></div><div class="hill h2"></div><div class="barn-shape"><span></span></div>
  </div>
  <header class="topbar">
    <button class="brand" data-nav="home" aria-label="Home"><span class="brand-mark">🐑</span><span><strong>Reading Pasture</strong><small>Lamb & Wolf Edition</small></span></button>
    <nav class="desktop-nav">
      <button data-nav="practice">Practice</button><button data-nav="bank">Reading Bank</button><button data-nav="vocab">Vocabulary</button><button data-nav="progress">Progress</button>
    </nav>
    <div class="controls"><button id="musicBtn" title="Music">♪</button><button id="sfxBtn" title="Sound effects">🔊</button><button id="themeBtn" title="Theme">☀</button></div>
  </header>
  <main id="app" class="app"></main>
  <footer><span>🐾 Read with the flock. Outsmart the inference wolf.</span><span>Offline · localStorage · no account required</span></footer>
  <div id="toast" class="toast" role="status"></div>
  <div id="modal" class="modal-backdrop hidden" role="dialog" aria-modal="true"><div class="modal" id="modalBody"></div></div>
  <input id="importFile" type="file" accept="application/json" hidden />
  <script src="script.js"></script>
</body>
</html>
