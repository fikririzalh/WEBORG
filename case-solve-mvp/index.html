<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Case Solve &amp; Stories Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #12161d;
  --bg-elevated: #1b212b;
  --bg-elevated-2: #212836;
  --paper: #ede4cc;
  --paper-ink: #2a2416;
  --text-primary: #efe8d8;
  --text-muted: #9a9686;
  --line: #333c4a;
  --amber: #d8a24a;
  --amber-strong: #e8b866;
  --amber-press: #b07f2e;
  --stamp-red: #b5533c;
  --stamp-green: #6b8f71;
}

* { box-sizing: border-box; }

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

html, body {
  height: 100%;
  background: var(--bg);
}

body {
  margin: 0;
  color: var(--text-primary);
  font-family: 'Lora', Georgia, 'Times New Roman', serif;
  font-size: 16px;
  line-height: 1.55;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  -webkit-tap-highlight-color: transparent;
}

#app {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100%;
}

h1, h2, h3, .brand, .topbar-title, button, .badge, .case-row-status, .stamp, .section-label, .case-row-num, .clue-num, legend {
  font-family: 'Courier Prime', 'Courier New', monospace;
}

/* ---------- Topbar ---------- */
.topbar {
  position: sticky;
  top: 0;
  padding-top: env(safe-area-inset-top, 0px);
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;
  padding-left: 16px;
  padding-right: 16px;
  min-height: 56px;
  z-index: 5;
}

.brand {
  font-size: 18px;
  letter-spacing: 0.04em;
  padding: 14px 0;
}

.brand-sub {
  display: none;
}

.topbar-title {
  font-size: 15px;
  letter-spacing: 0.02em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.back-btn {
  background: none;
  border: 1px solid var(--line);
  color: var(--text-primary);
  width: 36px;
  height: 36px;
  border-radius: 4px;
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
  flex-shrink: 0;
}
.back-btn:active { background: var(--bg-elevated); }

/* ---------- Layout ---------- */
.screen {
  padding: 18px 16px 40px;
}

.intro-text {
  color: var(--text-muted);
  font-size: 15px;
  margin: 0 0 20px;
}

.section-label {
  font-size: 12px;
  color: var(--amber);
  margin: 22px 0 10px;
  letter-spacing: 0.02em;
}

/* ---------- Buttons ---------- */
.btn {
  font-family: 'Courier Prime', 'Courier New', monospace;
  font-size: 14px;
  letter-spacing: 0.02em;
  border-radius: 4px;
  padding: 14px 18px;
  border: 1px solid transparent;
  cursor: pointer;
  min-height: 48px;
}
.btn:focus-visible {
  outline: 2px solid var(--amber-strong);
  outline-offset: 2px;
}
.btn-block { width: 100%; display: block; margin-top: 18px; }

.btn-primary {
  background: var(--amber);
  color: #1b1508;
  font-weight: 700;
}
.btn-primary:active { background: var(--amber-press); }
.btn-primary:disabled {
  background: var(--bg-elevated-2);
  color: var(--text-muted);
  cursor: not-allowed;
}

.btn-secondary {
  background: transparent;
  color: var(--text-primary);
  border: 1px solid var(--line);
}
.btn-secondary:active { background: var(--bg-elevated); }

.btn-hint {
  display: block;
  width: 100%;
  background: var(--bg-elevated);
  color: var(--amber-strong);
  border: 1px dashed var(--line);
  text-align: left;
  margin-bottom: 8px;
}
.btn-hint:active { background: var(--bg-elevated-2); }

.link-muted {
  display: block;
  margin: 28px auto 0;
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: 'Courier Prime', 'Courier New', monospace;
  font-size: 12px;
  text-decoration: underline;
  cursor: pointer;
  padding: 8px;
}

/* ---------- Set cards (home) ---------- */
.set-card {
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 16px;
  margin-bottom: 14px;
  background: var(--bg-elevated);
}
.set-card-locked {
  opacity: 0.55;
}
.set-card-name {
  font-family: 'Courier Prime', 'Courier New', monospace;
  font-size: 15px;
  margin-bottom: 4px;
}
.set-card-theme {
  color: var(--text-muted);
  font-size: 14px;
  margin-bottom: 12px;
}
.set-card-progress { margin-bottom: 14px; }
.progress-track {
  height: 6px;
  background: var(--bg-elevated-2);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 6px;
}
.progress-fill {
  height: 100%;
  background: var(--amber);
}
.progress-label {
  font-size: 12px;
  color: var(--text-muted);
  font-family: 'Courier Prime', 'Courier New', monospace;
}

/* ---------- Case list ---------- */
.case-list {
  list-style: none;
  margin: 0;
  padding: 0;
  border-top: 1px solid var(--line);
}
.case-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 4px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}
.case-row:active { background: var(--bg-elevated); }
.case-row-num {
  font-size: 12px;
  color: var(--text-muted);
  width: 46px;
  flex-shrink: 0;
}
.case-row-main { flex: 1; min-width: 0; }
.case-row-title {
  font-size: 16px;
  margin-bottom: 4px;
}
.case-row-meta {
  display: flex;
  align-items: center;
  gap: 8px;
}
.meta-time {
  font-size: 12px;
  color: var(--text-muted);
  font-family: 'Courier Prime', 'Courier New', monospace;
}
.case-row-status {
  font-size: 10px;
  color: var(--text-muted);
  text-align: right;
  flex-shrink: 0;
  width: 76px;
  line-height: 1.3;
}
.status-solved .case-row-status { color: var(--stamp-green); }
.status-attempted .case-row-status { color: var(--stamp-red); }

/* ---------- Badges ---------- */
.badge {
  font-size: 10px;
  padding: 3px 7px;
  border-radius: 3px;
  border: 1px solid var(--line);
}
.badge-mudah { color: var(--stamp-green); border-color: var(--stamp-green); }
.badge-menengah { color: var(--amber-strong); border-color: var(--amber-strong); }
.badge-sulit { color: var(--stamp-red); border-color: var(--stamp-red); }

/* ---------- Case screen ---------- */
.case-meta-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.mini-note {
  font-size: 13px;
  color: var(--stamp-green);
  border: 1px solid var(--stamp-green);
  border-radius: 4px;
  padding: 8px 10px;
  margin-bottom: 14px;
}
.paper-panel {
  background: var(--paper);
  color: var(--paper-ink);
  border-radius: 3px;
  padding: 18px 16px;
  box-shadow: 0 2px 0 rgba(0,0,0,0.25);
}
.paper-panel p {
  margin: 0;
  font-size: 16px;
  line-height: 1.65;
}

.clue-section { margin-top: 6px; }
.clue-open {
  background: var(--bg-elevated);
  border-left: 3px solid var(--amber);
  border-radius: 0 4px 4px 0;
  padding: 10px 12px;
  margin-bottom: 8px;
}
.clue-num {
  display: block;
  font-size: 11px;
  color: var(--amber-strong);
  margin-bottom: 4px;
}
.clue-open p { margin: 0; font-size: 14px; }

/* ---------- Answer screen ---------- */
.question-block {
  border: none;
  padding: 0;
  margin: 0 0 22px;
}
.question-block legend {
  font-size: 14px;
  color: var(--amber-strong);
  padding: 0;
  margin-bottom: 10px;
}
.option-row {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 12px 12px;
  margin-bottom: 8px;
  cursor: pointer;
  font-size: 15px;
}
.option-row input { width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--amber); }
.option-selected {
  border-color: var(--amber);
  background: var(--bg-elevated);
}

/* ---------- Stories Time: secret screen ---------- */
.secret-banner {
  border: 2px solid var(--amber);
  background: var(--bg-elevated);
  color: var(--amber-strong);
  font-family: 'Courier Prime', 'Courier New', monospace;
  font-size: 12.5px;
  letter-spacing: 0.01em;
  border-radius: 5px;
  padding: 10px 12px;
  margin-bottom: 18px;
  line-height: 1.5;
}
.cheat-card {
  background: var(--bg-elevated);
  border-left: 3px solid var(--amber);
  border-radius: 0 4px 4px 0;
  padding: 10px 12px;
  font-size: 14px;
  margin-bottom: 4px;
}
.keypoint-list {
  margin: 0 0 6px;
  padding-left: 20px;
  font-size: 14.5px;
  line-height: 1.6;
}
.keypoint-list li {
  margin-bottom: 7px;
}

/* ---------- Result screen ---------- */
.stamp {
  font-family: 'Courier Prime', 'Courier New', monospace;
  font-weight: 700;
  font-size: 22px;
  text-align: center;
  letter-spacing: 0.06em;
  border: 3px solid;
  border-radius: 6px;
  padding: 14px 10px;
  margin-bottom: 20px;
  transform: rotate(-2deg);
  opacity: 0;
}
.stamp-solved { color: var(--stamp-green); border-color: var(--stamp-green); }
.stamp-failed { color: var(--stamp-red); border-color: var(--stamp-red); }
.stamp-animate {
  animation: stamp-slam 0.4s ease-out forwards;
}
@keyframes stamp-slam {
  0% { opacity: 0; transform: rotate(-2deg) scale(1.6); }
  70% { opacity: 1; transform: rotate(-2deg) scale(0.94); }
  100% { opacity: 1; transform: rotate(-2deg) scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  .stamp-animate { animation: none; opacity: 1; }
}

.result-breakdown { margin-bottom: 4px; }
.result-line {
  border-left: 3px solid var(--line);
  padding: 8px 12px;
  margin-bottom: 10px;
  font-size: 14px;
}
.result-correct { border-left-color: var(--stamp-green); }
.result-wrong { border-left-color: var(--stamp-red); }
.result-q { color: var(--text-muted); font-size: 12px; margin-bottom: 4px; font-family: 'Courier Prime', 'Courier New', monospace; }
.result-a { margin-bottom: 2px; }
.result-correct-a { color: var(--stamp-green); }

@media (min-width: 640px) {
  #app { padding-top: 12px; }
  .paper-panel { padding: 24px 22px; }
}
</style>
</head>

// ===== STORAGE =====
function loadProgress(key) {
  try {
    var raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}
function saveProgress(key, progress) {
  try {
    localStorage.setItem(key, JSON.stringify(progress));
  } catch (e) {
    // silently ignore, app still works without persistence
  }
}

// ===== SHARED HELPERS =====
function findSetIn(dataset, setId) {
  return dataset.sets.filter(function (s) { return s.id === setId; })[0];
}
function findCaseIn(dataset, setId, caseId) {
  var set = findSetIn(dataset, setId);
  if (!set) return null;
  return set.cases.filter(function (c) { return c.id === caseId; })[0];
}
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
var DIFF_LABEL = { mudah: 'Mudah', menengah: 'Menengah', sulit: 'Sulit' };
function difficultyBadge(diff) {
  return '<span class="badge badge-' + diff + '">' + DIFF_LABEL[diff] + '</span>';
}

var CS_PROGRESS_KEY = 'caseSolveProgress';

function csStatusOf(progress, caseId) {
  var entry = progress[caseId];
  if (!entry) return 'baru';
  if (entry.status === 'solved') return 'solved';
  return 'attempted';
}
function csStatusLabel(status) {
  if (status === 'solved') return 'TERPECAHKAN';
  if (status === 'attempted') return 'BELUM TEPAT';
  return 'BELUM DICOBA';
}
function csSetStats(set, progress) {
  var total = set.cases.length;
  var solved = 0;
  for (var i = 0; i < set.cases.length; i++) {
    if (progress[set.cases[i].id] && progress[set.cases[i].id].status === 'solved') solved++;
  }
  return { total: total, solved: solved };
}

function csRenderHome() {
  var progress = loadProgress(CS_PROGRESS_KEY);
  var html = '';
  html += '<header class="topbar"><button class="back-btn" onclick="App.goLanding()" aria-label="Kembali">‹</button>' +
    '<div class="topbar-title">CASE SOLVE</div></header>';
  html += '<main class="screen">';
  html += '<p class="intro-text">Baca tiap berkas, kumpulkan petunjuk, lalu ajukan kesimpulanmu tentang siapa, bagaimana, dan kenapa.</p>';

  for (var i = 0; i < DATA_CS.sets.length; i++) {
    var set = DATA_CS.sets[i];

      html += '<section class="set-card set-card-locked">' +
        '<div class="set-card-name">' + escapeHtml(set.name) + '</div>' +
        '<div class="set-card-theme">' + escapeHtml(set.theme) + '</div>' +
        '</section>';
      continue;
    }
    var stats = csSetStats(set, progress);
    html += '<section class="set-card">' +
      '<div class="set-card-name">' + escapeHtml(set.name) + '</div>' +
      '<div class="set-card-theme">' + escapeHtml(set.theme) + '</div>' +
      '<div class="set-card-progress">' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + Math.round((stats.solved / stats.total) * 100) + '%"></div></div>' +
      '<div class="progress-label">' + stats.solved + ' dari ' + stats.total + ' kasus terpecahkan</div>' +
      '</div>' +
      '<button class="btn btn-primary" onclick="App.cs.openSet(\'' + set.id + '\')">Buka Set</button>' +
      '</section>';
  }

  html += '<button class="link-muted" onclick="App.cs.resetProgress()">Atur ulang progres Case Solve</button>';
  html += '</main>';
  document.getElementById('app').innerHTML = html;
}

function csRenderCaseList(setId) {
  var set = findSetIn(DATA_CS, setId);
  var progress = loadProgress(CS_PROGRESS_KEY);
  var html = '';
  html += '<header class="topbar"><button class="back-btn" onclick="App.cs.goHome()" aria-label="Kembali">‹</button>' +
    '<div class="topbar-title">' + escapeHtml(set.name) + '</div></header>';
  html += '<main class="screen">';
  html += '<ul class="case-list">';
  for (var i = 0; i < set.cases.length; i++) {
    var c = set.cases[i];
    var status = csStatusOf(progress, c.id);
    html += '<li class="case-row status-' + status + '" onclick="App.cs.openCase(\'' + setId + '\',\'' + c.id + '\')">' +
      '<div class="case-row-num">No. ' + String(i + 1).padStart(2, '0') + '</div>' +
      '<div class="case-row-main">' +
      '<div class="case-row-title">' + escapeHtml(c.title) + '</div>' +
      '<div class="case-row-meta">' + difficultyBadge(c.difficulty) + '<span class="meta-time">' + c.time + '</span></div>' +
      '</div>' +
      '<div class="case-row-status">' + csStatusLabel(status) + '</div>' +
      '</li>';
  }
  html += '</ul>';
  html += '</main>';
  document.getElementById('app').innerHTML = html;
}

function csRenderCaseScreen(setId, caseId) {
  var c = findCaseIn(DATA_CS, setId, caseId);
  var progress = loadProgress(CS_PROGRESS_KEY);
  var status = csStatusOf(progress, caseId);
  var revealed = state.revealedHints || [];
  var html = '';
  html += '<header class="topbar"><button class="back-btn" onclick="App.cs.openSet(\'' + setId + '\')" aria-label="Kembali">‹</button>' +
    '<div class="topbar-title">' + escapeHtml(c.title) + '</div></header>';
  html += '<main class="screen">';
  if (status === 'solved') {
    html += '<div class="mini-note">Kasus ini sudah kamu pecahkan. Baca ulang atau coba susun teori lain.</div>';
  }
  html += '<div class="case-meta-row">' + difficultyBadge(c.difficulty) + '<span class="meta-time">' + c.time + '</span></div>';
  html += '<article class="paper-panel"><p>' + escapeHtml(c.story) + '</p></article>';

  html += '<section class="clue-section"><div class="section-label">Petunjuk Tambahan</div>';
  for (var i = 0; i < c.clues.length; i++) {
    if (revealed.indexOf(i) !== -1) {
      html += '<div class="clue-open"><span class="clue-num">Petunjuk ' + (i + 1) + '</span><p>' + escapeHtml(c.clues[i]) + '</p></div>';
    } else {
      html += '<button class="btn btn-hint" onclick="App.cs.revealHint(' + i + ')">Buka Petunjuk ' + (i + 1) + '</button>';
    }
  }
  html += '</section>';

  html += '<button class="btn btn-primary btn-block" onclick="App.cs.openAnswer(\'' + setId + '\',\'' + caseId + '\')">Lanjut ke Teori Saya</button>';
  html += '</main>';
  document.getElementById('app').innerHTML = html;
}

function csRenderAnswerScreen(setId, caseId) {
  var c = findCaseIn(DATA_CS, setId, caseId);
  var html = '';
  html += '<header class="topbar"><button class="back-btn" onclick="App.cs.openCase(\'' + setId + '\',\'' + caseId + '\')" aria-label="Kembali">‹</button>' +
    '<div class="topbar-title">Teori Saya</div></header>';
  html += '<main class="screen">';
  html += '<p class="intro-text">Pilih satu jawaban untuk tiap pertanyaan berdasarkan cerita dan petunjuk yang sudah kamu baca.</p>';

  for (var qi = 0; qi < c.questions.length; qi++) {
    var q = c.questions[qi];
    html += '<fieldset class="question-block"><legend>' + escapeHtml(q.label) + '</legend>';
    for (var oi = 0; oi < q.options.length; oi++) {
      var checked = state.answers[q.id] === oi ? ' checked' : '';
      var selectedClass = state.answers[q.id] === oi ? ' option-selected' : '';
      html += '<label class="option-row' + selectedClass + '">' +
        '<input type="radio" name="q_' + q.id + '" value="' + oi + '"' + checked + ' onchange="App.cs.selectAnswer(\'' + q.id + '\',' + oi + ')">' +
        '<span>' + escapeHtml(q.options[oi]) + '</span>' +
        '</label>';
    }
    html += '</fieldset>';
  }

  var answeredCount = Object.keys(state.answers).length;
  var allAnswered = answeredCount === c.questions.length;
  html += '<button class="btn btn-primary btn-block" ' + (allAnswered ? '' : 'disabled') + ' onclick="App.cs.submitAnswers(\'' + setId + '\',\'' + caseId + '\')">Ajukan Kesimpulan</button>';
  html += '</main>';
  document.getElementById('app').innerHTML = html;
}

function csRenderResultScreen(setId, caseId, results, solved) {
  var c = findCaseIn(DATA_CS, setId, caseId);
  var set = findSetIn(DATA_CS, setId);
  var idx = -1;
  for (var i = 0; i < set.cases.length; i++) { if (set.cases[i].id === caseId) idx = i; }
  var nextCase = (idx > -1 && idx < set.cases.length - 1) ? set.cases[idx + 1] : null;

  var html = '';
  html += '<header class="topbar"><button class="back-btn" onclick="App.cs.openSet(\'' + setId + '\')" aria-label="Kembali">‹</button>' +
    '<div class="topbar-title">Hasil</div></header>';
  html += '<main class="screen">';
  html += '<div class="stamp stamp-' + (solved ? 'solved' : 'failed') + '">' + (solved ? 'TERPECAHKAN' : 'BELUM TEPAT') + '</div>';

  html += '<div class="result-breakdown">';
  for (var qi = 0; qi < c.questions.length; qi++) {
    var q = c.questions[qi];
    var r = results[qi];
    html += '<div class="result-line ' + (r.correct ? 'result-correct' : 'result-wrong') + '">' +
      '<div class="result-q">' + escapeHtml(q.label) + '</div>' +
      '<div class="result-a">Jawabanmu: ' + escapeHtml(q.options[r.chosen]) + (r.correct ? '' : ' (kurang tepat)') + '</div>' +
      (r.correct ? '' : '<div class="result-correct-a">Jawaban tepat: ' + escapeHtml(q.options[q.correct]) + '</div>') +
      '</div>';
  }
  html += '</div>';

  html += '<div class="section-label">Penjelasan</div>';
  html += '<article class="paper-panel"><p>' + escapeHtml(c.explanation) + '</p></article>';

  if (solved) {
    if (nextCase) {
      html += '<button class="btn btn-primary btn-block" onclick="App.cs.openCase(\'' + setId + '\',\'' + nextCase.id + '\')">Kasus Berikutnya</button>';
    }
    html += '<button class="btn btn-secondary btn-block" onclick="App.cs.openSet(\'' + setId + '\')">Kembali ke Daftar Kasus</button>';
  } else {
    html += '<button class="btn btn-primary btn-block" onclick="App.cs.retryCase(\'' + setId + '\',\'' + caseId + '\')">Coba Lagi</button>';
    html += '<button class="btn btn-secondary btn-block" onclick="App.cs.openSet(\'' + setId + '\')">Kembali ke Daftar Kasus</button>';
  }

  html += '</main>';
  document.getElementById('app').innerHTML = html;

  var stampEl = document.querySelector('.stamp');
  if (stampEl) stampEl.classList.add('stamp-animate');
}

// ---- CS actions ----
var CS = {
  goHome: function () {
    state.screen = 'cs-home';
    state.setId = null;
    state.caseId = null;
    csRenderHome();
  },
  openSet: function (setId) {
    state.screen = 'cs-caselist';
    state.setId = setId;
    csRenderCaseList(setId);
  },
  openCase: function (setId, caseId) {
    state.screen = 'cs-case';
    state.setId = setId;
    state.caseId = caseId;
    state.answers = {};
    state.revealedHints = [];
    csRenderCaseScreen(setId, caseId);
  },
  revealHint: function (index) {
    if (!state.revealedHints) state.revealedHints = [];
    if (state.revealedHints.indexOf(index) === -1) state.revealedHints.push(index);
    csRenderCaseScreen(state.setId, state.caseId);
  },
  openAnswer: function (setId, caseId) {
    state.screen = 'cs-answer';
    csRenderAnswerScreen(setId, caseId);
  },
  selectAnswer: function (questionId, optionIndex) {
    state.answers[questionId] = optionIndex;
    csRenderAnswerScreen(state.setId, state.caseId);
  },
  submitAnswers: function (setId, caseId) {
    var c = findCaseIn(DATA_CS, setId, caseId);
    var results = [];
    var allCorrect = true;
    for (var i = 0; i < c.questions.length; i++) {
      var q = c.questions[i];
      var chosen = state.answers[q.id];
      var correct = chosen === q.correct;
      if (!correct) allCorrect = false;
      results.push({ chosen: chosen, correct: correct });
    }
    var progress = loadProgress(CS_PROGRESS_KEY);
    var entry = progress[caseId] || { attempts: 0, hintsUsed: 0, status: 'attempted' };
    entry.attempts += 1;
    entry.hintsUsed = (state.revealedHints || []).length;
    if (allCorrect) entry.status = 'solved';
    else if (entry.status !== 'solved') entry.status = 'attempted';
    progress[caseId] = entry;
    saveProgress(CS_PROGRESS_KEY, progress);

    state.screen = 'cs-result';
    csRenderResultScreen(setId, caseId, results, allCorrect);
  },
  retryCase: function (setId, caseId) {
    state.answers = {};
    state.screen = 'cs-answer';
    csRenderAnswerScreen(setId, caseId);
  },
  resetProgress: function () {
    var ok = window.confirm('Hapus semua progres Case Solve di perangkat ini?');
    if (!ok) return;
    try { localStorage.removeItem(CS_PROGRESS_KEY); } catch (e) {}
    csRenderHome();
  }
};

  var progress = loadProgress(ST_PROGRESS_KEY);
  var html = '';
  html += '<header class="topbar"><button class="back-btn" onclick="App.st.goHome()" aria-label="Kembali">‹</button>' +
    '<div class="topbar-title">' + escapeHtml(set.name) + '</div></header>';
  html += '<main class="screen">';
  html += '<button class="btn btn-primary btn-block" onclick="App.st.shuffle(\'' + setId + '\')">Kocok Acak</button>';
  html += '<ul class="case-list">';
  for (var i = 0; i < set.cases.length; i++) {
    var c = set.cases[i];
    var status = stStatusOf(progress, c.id);
    html += '<li class="case-row status-' + (status === 'played' ? 'solved' : 'baru') + '" onclick="App.st.openStory(\'' + setId + '\',\'' + c.id + '\')">' +
      '<div class="case-row-num">No. ' + String(i + 1).padStart(2, '0') + '</div>' +
      '<div class="case-row-main">' +
      '<div class="case-row-title">' + escapeHtml(c.title) + '</div>' +
      '<div class="case-row-meta">' + difficultyBadge(c.difficulty) + '</div>' +
      '</div>' +
      '<div class="case-row-status">' + (status === 'played' ? 'SUDAH DIMAINKAN' : 'BELUM DIMAINKAN') + '</div>' +
      '</li>';
  }
  html += '</ul>';
  html += '</main>';
  document.getElementById('app').innerHTML = html;
}

function stRenderFront(setId, storyId) {
  var set = findSetIn(DATA_ST, setId);
  var c = findCaseIn(DATA_ST, setId, storyId);
  var idx = -1;
  for (var i = 0; i < set.cases.length; i++) { if (set.cases[i].id === storyId) idx = i; }
  var html = '';
  html += '<header class="topbar"><button class="back-btn" onclick="App.st.openSet(\'' + setId + '\')" aria-label="Kembali">‹</button>' +
    '<div class="topbar-title">Cerita No. ' + String(idx + 1).padStart(2, '0') + '</div></header>';
  html += '<main class="screen">';
  html += '<div class="case-meta-row">' + difficultyBadge(c.difficulty) + '</div>';
  html += '<div class="section-label">Bacakan keras-keras ke pemain</div>';
  html += '<article class="paper-panel"><p>' + escapeHtml(c.riddle) + '</p></article>';
  html += '<button class="btn btn-primary btn-block" onclick="App.st.openSecret(\'' + setId + '\',\'' + storyId + '\')">Lihat Solusi (Rahasia)</button>';
  html += '</main>';
  document.getElementById('app').innerHTML = html;
}

function stRenderSecret(setId, storyId) {
  var set = findSetIn(DATA_ST, setId);
  var c = findCaseIn(DATA_ST, setId, storyId);
  var revealed = state.revealedHints || [];
  var idx = -1;
  for (var i = 0; i < set.cases.length; i++) { if (set.cases[i].id === storyId) idx = i; }
  var nextStory = (idx > -1 && idx < set.cases.length - 1) ? set.cases[idx + 1] : null;

  var html = '';
  html += '<header class="topbar"><button class="back-btn" onclick="App.st.openStory(\'' + setId + '\',\'' + storyId + '\')" aria-label="Kembali">‹</button>' +
    '<div class="topbar-title">' + escapeHtml(c.title) + '</div></header>';
  html += '<main class="screen">';
  html += '<div class="secret-banner">&#128274; Layar Rahasia &mdash; pegang HP menghadap kamu, jangan sampai pemain lain melihat</div>';

  html += '<div class="section-label">Kartu Contekan</div>';
  html += '<div class="cheat-card">Jawab pertanyaan pemain hanya dengan salah satu dari: <strong>Ya</strong> / <strong>Tidak</strong> / <strong>Tidak relevan</strong>.</div>';

  html += '<div class="section-label">Poin Kunci (jawab cepat)</div>';
  html += '<ul class="keypoint-list">';
  for (var i = 0; i < c.keyPoints.length; i++) {
    html += '<li>' + escapeHtml(c.keyPoints[i]) + '</li>';
  }
  html += '</ul>';

  html += '<div class="section-label">Petunjuk Tambahan (kalau pemain buntu)</div>';
  for (var hi = 0; hi < c.hints.length; hi++) {
    if (revealed.indexOf(hi) !== -1) {
      html += '<div class="clue-open"><span class="clue-num">Petunjuk ' + (hi + 1) + '</span><p>' + escapeHtml(c.hints[hi]) + '</p></div>';
    } else {
      html += '<button class="btn btn-hint" onclick="App.st.revealHint(' + hi + ')">Buka Petunjuk ' + (hi + 1) + '</button>';
    }
  }

  html += '<div class="section-label">Solusi Lengkap</div>';
  html += '<article class="paper-panel"><p>' + escapeHtml(c.fullSolution) + '</p></article>';

  if (nextStory) {
    html += '<button class="btn btn-primary btn-block" onclick="App.st.markDone(\'' + setId + '\',\'' + storyId + '\',\'' + nextStory.id + '\')">Tandai Selesai &amp; Cerita Berikutnya</button>';
  } else {
    html += '<button class="btn btn-primary btn-block" onclick="App.st.markDone(\'' + setId + '\',\'' + storyId + '\',null)">Tandai Selesai</button>';
  }
  html += '<button class="btn btn-secondary btn-block" onclick="App.st.openSet(\'' + setId + '\')">Kembali ke Daftar Cerita</button>';

  html += '</main>';
  document.getElementById('app').innerHTML = html;
}

// ---- ST actions ----
var ST = {
  goHome: function () {
    state.screen = 'st-home';
    state.setId = null;
    state.caseId = null;
    stRenderHome();
  },
  openSet: function (setId) {
    state.screen = 'st-list';
    state.setId = setId;
    stRenderList(setId);
  },
  openStory: function (setId, storyId) {
    state.screen = 'st-front';
    state.setId = setId;
    state.caseId = storyId;
    state.revealedHints = [];
    stRenderFront(setId, storyId);
  },
  openSecret: function (setId, storyId) {
    state.screen = 'st-secret';
    stRenderSecret(setId, storyId);
  },
  revealHint: function (index) {
    if (!state.revealedHints) state.revealedHints = [];
    if (state.revealedHints.indexOf(index) === -1) state.revealedHints.push(index);
    stRenderSecret(state.setId, state.caseId);
  },
  shuffle: function (setId) {
    var set = findSetIn(DATA_ST, setId);
    var progress = loadProgress(ST_PROGRESS_KEY);
    var unplayed = set.cases.filter(function (c) { return stStatusOf(progress, c.id) !== 'played'; });
    var pool = unplayed.length > 0 ? unplayed : set.cases;
    var pick = pool[Math.floor(Math.random() * pool.length)];
    ST.openStory(setId, pick.id);
  },
  markDone: function (setId, storyId, nextStoryId) {
    var progress = loadProgress(ST_PROGRESS_KEY);
    progress[storyId] = { played: true };
    saveProgress(ST_PROGRESS_KEY, progress);
    if (nextStoryId) {
      ST.openStory(setId, nextStoryId);
    } else {
      ST.openSet(setId);
    }
  },
  resetProgress: function () {
    var ok = window.confirm('Hapus semua progres Stories Time di perangkat ini?');
    if (!ok) return;
    try { localStorage.removeItem(ST_PROGRESS_KEY); } catch (e) {}
    stRenderHome();
  }
};

// ===================================================================
// ===== APP ROOT =====
// ===================================================================
var App = {
  cs: CS,
  st: ST,
  goLanding: function () {
    state.mode = null;
    state.screen = 'landing';
    state.setId = null;
    state.caseId = null;
    renderLanding();
  },
  enterMode: function (mode) {
    state.mode = mode;
    if (mode === 'cs') CS.goHome();
    else if (mode === 'st') ST.goHome();
  }
};

window.App = App;
App.goLanding();
</script>
</body>
</html>
