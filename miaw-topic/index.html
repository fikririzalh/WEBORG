const categories = questionBank.map(([cat]) => cat);

const defaultQuestions = (() => {
  const seen = new Set();
  const out = [];
  questionBank.forEach(([cat, items]) => {
    items.forEach(item => {
      const text = typeof item === "string" ? item : item.t;
      const link = typeof item === "string" ? "" : (item.l || "");
      let id = hashId(cat + "|" + text);
      while (seen.has(id)) id += "x";
      seen.add(id);
      const q = { id, cat, text };
      if (link) q.link = link;
      out.push(q);
    });
  });
  return out;
})();

// ===== PENYIMPANAN (aman kalau localStorage diblokir) =====
function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return fallback;
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

const store = {
  user: loadJSON(USER_QUESTIONS_KEY, []),
  edited: loadJSON(EDITED_DEFAULTS_KEY, {}),
  deleted: loadJSON(DELETED_DEFAULTS_KEY, [])
};
function persist() {
  saveJSON(USER_QUESTIONS_KEY, store.user);
  saveJSON(EDITED_DEFAULTS_KEY, store.edited);
  saveJSON(DELETED_DEFAULTS_KEY, store.deleted);
}

// Gabungin: defaultQuestions (dari kode) + editan + hapusan + tambahan user
function buildQuestionList() {
  const fromDefaults = defaultQuestions
    .filter(q => !store.deleted.includes(q.id))
    .map(q => store.edited[q.id] ? { ...q, ...store.edited[q.id] } : q);
  return [...fromDefaults, ...store.user];
}

function loadFavorites() { return loadJSON(FAV_KEY, []); }
function saveFavorites(list) { saveJSON(FAV_KEY, list); }

let questions = buildQuestionList();
let favorites = loadFavorites();
let currentCategory = "Semua";
let currentQuestion = null;
let editingId = null;

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
// Hanya izinkan link http/https
function safeUrl(u) {
  try {
    const x = new URL(u);
    return (x.protocol === "http:" || x.protocol === "https:") ? x.href : null;
  } catch (e) { return null; }
}
function linkLabel(u) {
  try { return "🔗 Baca selengkapnya (" + new URL(u).hostname + ")"; } catch (e) { return "🔗 Baca selengkapnya"; }
}

// ===== TAB SWITCHING =====
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.view).classList.add("active");
    if (btn.dataset.view === "manageView") renderManageList();
  });
});

// ===== MAIN VIEW LOGIC =====
const categoriesEl = document.getElementById("categories");
const cardText = document.getElementById("cardText");
const cardTag = document.getElementById("cardTag");
const randomBtn = document.getElementById("randomBtn");
const bookmarkBtn = document.getElementById("bookmarkBtn");
const favList = document.getElementById("favList");
const emptyFav = document.getElementById("emptyFav");
const card = document.getElementById("card");
const cardLink = document.getElementById("cardLink");
const footerInfo = document.getElementById("footerInfo");

function updateFooter() {
  const usedCats = new Set(questions.map(q => q.cat)).size;
  footerInfo.textContent = questions.length + " pertanyaan dalam " + usedCats + " topik — dibuat dengan HTML, CSS & JS 🚀";
}

function setCardLink(q) {
  const u = q && q.link ? safeUrl(q.link) : null;
  if (u) {
    cardLink.href = u;
    cardLink.textContent = linkLabel(u);
    cardLink.style.display = "inline-block";
  } else {
    cardLink.removeAttribute("href");
    cardLink.style.display = "none";
  }
}

function renderCategories() {
  const all = ["Semua", ...categories];
  categoriesEl.innerHTML = "";
  all.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (cat === currentCategory ? " active" : "");
    btn.textContent = cat;
    btn.onclick = () => {
      currentCategory = cat;
      renderCategories();
    };
    categoriesEl.appendChild(btn);
  });
}

function getRandomQuestion() {
  const pool = currentCategory === "Semua" ? questions : questions.filter(q => q.cat === currentCategory);
  if (pool.length === 0) return null;
  if (pool.length === 1) return pool[0];
  let q;
  do {
    q = pool[Math.floor(Math.random() * pool.length)];
  } while (currentQuestion && q.id === currentQuestion.id);
  return q;
}

function showQuestion() {
  const q = getRandomQuestion();
  if (!q) {
    cardTag.textContent = "-";
    cardText.textContent = "Belum ada pertanyaan di kategori ini. Tambahin dulu di tab Kelola Pertanyaan!";
    currentQuestion = null;
    setCardLink(null);
    updateBookmarkState();
    return;
  }
  currentQuestion = q;
  cardTag.textContent = q.cat;
  cardText.textContent = q.text;
  setCardLink(q);
  card.style.animation = "none";
  void card.offsetWidth;
  card.style.animation = "pop 0.4s ease";
  updateBookmarkState();
}

function updateBookmarkState() {
  if (!currentQuestion) { bookmarkBtn.classList.remove("active"); return; }
  const isFav = favorites.some(f => f.id === currentQuestion.id);
  bookmarkBtn.classList.toggle("active", isFav);
}

function renderFavorites() {
  favList.innerHTML = "";
  if (favorites.length === 0) {
    emptyFav.style.display = "block";
    return;
  }
  emptyFav.style.display = "none";
  favorites.forEach((f, i) => {
    const li = document.createElement("li");
    const fu = f.link ? safeUrl(f.link) : null;
    li.innerHTML = `<span>${esc(f.text)}${fu ? `<br><a class="item-link" href="${esc(fu)}" target="_blank" rel="noopener noreferrer">${esc(linkLabel(fu))}</a>` : ""}</span>`;
    const delBtn = document.createElement("button");
    delBtn.textContent = "✕";
    delBtn.setAttribute("aria-label", "Hapus dari favorit");
    delBtn.onclick = () => {
      favorites.splice(i, 1);
      saveFavorites(favorites);
      renderFavorites();
      updateBookmarkState();
    };
    li.appendChild(delBtn);
    favList.appendChild(li);
  });
}

randomBtn.addEventListener("click", showQuestion);
bookmarkBtn.addEventListener("click", () => {
  if (!currentQuestion) return;
  const idx = favorites.findIndex(f => f.id === currentQuestion.id);
  if (idx >= 0) {
    favorites.splice(idx, 1);
  } else {
    favorites.push(currentQuestion);
  }
  saveFavorites(favorites);
  renderFavorites();
  updateBookmarkState();
});

// ===== CRUD (MANAGE) VIEW LOGIC =====
const addNewBtn = document.getElementById("addNewBtn");
const manageForm = document.getElementById("manageForm");
const formCategory = document.getElementById("formCategory");
const formText = document.getElementById("formText");
const formLink = document.getElementById("formLink");
const formMsg = document.getElementById("formMsg");
const formSaveBtn = document.getElementById("formSaveBtn");
const formCancelBtn = document.getElementById("formCancelBtn");
const manageList = document.getElementById("manageList");
const manageFilter = document.getElementById("manageFilter");

function populateCategorySelect() {
  formCategory.innerHTML = "";
  categories.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat;
    opt.textContent = cat;
    formCategory.appendChild(opt);
  });
}
populateCategorySelect();

function populateFilter() {
  const keep = manageFilter.value || "Semua";
  manageFilter.innerHTML = "";
  const allOpt = document.createElement("option");
  allOpt.value = "Semua";
  allOpt.textContent = "Semua kategori (" + questions.length + ")";
  manageFilter.appendChild(allOpt);
  categories.forEach(cat => {
    const n = questions.filter(q => q.cat === cat).length;
    const opt = document.createElement("option");
    opt.value = cat;
    opt.textContent = cat + " (" + n + ")";
    manageFilter.appendChild(opt);
  });
  manageFilter.value = [...manageFilter.options].some(o => o.value === keep) ? keep : "Semua";
}
manageFilter.addEventListener("change", renderManageList);

function showFormMsg(msg) { formMsg.textContent = msg || ""; }

function openForm(question = null) {
  manageForm.style.display = "block";
  showFormMsg("");
  if (question) {
    editingId = question.id;
    formCategory.value = question.cat;
    formText.value = question.text;
    formLink.value = question.link || "";
  } else {
    editingId = null;
    formCategory.value = manageFilter.value !== "Semua" ? manageFilter.value : categories[0];
    formText.value = "";
    formLink.value = "";
  }
  formText.focus();
}
function closeForm() {
  manageForm.style.display = "none";
  editingId = null;
  formText.value = "";
  formLink.value = "";
  showFormMsg("");
}
addNewBtn.addEventListener("click", () => openForm());
formCancelBtn.addEventListener("click", closeForm);

formSaveBtn.addEventListener("click", () => {
  const text = formText.value.trim();
  const cat = formCategory.value;
  const rawLink = formLink.value.trim();
  const link = rawLink ? safeUrl(rawLink) : "";
  if (rawLink && !link) { showFormMsg("Link harus diawali http:// atau https:// ya."); return; }
  if (!text) { showFormMsg("Pertanyaan tidak boleh kosong."); return; }

  if (editingId) {
    if (editingId.startsWith("d")) {
      // pertanyaan bawaan -> simpan sebagai "editan", questionBank tetap utuh
      store.edited[editingId] = { cat, text, link };
    } else {
      const uq = store.user.find(q => q.id === editingId);
      if (uq) { uq.text = text; uq.cat = cat; uq.link = link; }
    }
  } else {
    store.user.push({ id: makeId(), cat, text, link });
  }
  persist();
  questions = buildQuestionList();
  closeForm();
  renderManageList();
  updateFooter();
});

function deleteQuestion(q) {
  if (q.id.startsWith("d")) {
    if (!store.deleted.includes(q.id)) store.deleted.push(q.id);
  } else {
    store.user = store.user.filter(item => item.id !== q.id);
  }
  persist();
  questions = buildQuestionList();
  favorites = favorites.filter(f => f.id !== q.id);
  saveFavorites(favorites);
  if (currentQuestion && currentQuestion.id === q.id) { currentQuestion = null; updateBookmarkState(); }
  renderManageList();
  renderFavorites();
  updateFooter();
}

function renderManageList() {
  populateFilter();
  manageList.innerHTML = "";
  const f = manageFilter.value;
  const shown = f === "Semua" ? questions : questions.filter(q => q.cat === f);
  if (shown.length === 0) {
    manageList.innerHTML = `<li><span class="q-text">Belum ada pertanyaan. Tambahin dulu!</span></li>`;
    return;
  }
  shown.forEach(q => {
    const li = document.createElement("li");
    const u = q.link ? safeUrl(q.link) : null;
    li.innerHTML = `
      <div class="q-text">
        <span class="q-cat">${esc(q.cat)}</span>
        ${esc(q.text)}
        ${u ? `<br><a class="item-link" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(linkLabel(u))}</a>` : ""}
      </div>
      <div class="manage-actions">
        <button class="btn-edit" title="Edit" aria-label="Edit">✏️</button>
        <button class="btn-del" title="Hapus" aria-label="Hapus">🗑️</button>
      </div>
    `;
    li.querySelector(".btn-edit").addEventListener("click", () => openForm(q));
    const delBtn = li.querySelector(".btn-del");
    let timer = null;
    delBtn.addEventListener("click", () => {
      if (!delBtn.classList.contains("confirming")) {
        // klik pertama: minta konfirmasi (tanpa dialog bawaan browser)
        delBtn.classList.add("confirming");
        delBtn.textContent = "Yakin hapus?";
        timer = setTimeout(() => {
          delBtn.classList.remove("confirming");
          delBtn.textContent = "🗑️";
        }, 3000);
        return;
      }
      clearTimeout(timer);
      deleteQuestion(q);
    });
    manageList.appendChild(li);
  });
}

// ===== INIT =====
renderCategories();
renderFavorites();
updateFooter();
