function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return fallback;
}
function saveJSON(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

// Gabungin: defaultQuestions (dari kode) + editan + hapusan + tambahan user
function buildQuestionList() {
  const editedMap = loadJSON(EDITED_DEFAULTS_KEY, {});   // { "d1": {cat, text}, ... }
  const deletedIds = loadJSON(DELETED_DEFAULTS_KEY, []); // ["d3", ...]
  const userQuestions = loadJSON(USER_QUESTIONS_KEY, []);

  const fromDefaults = defaultQuestions
    .filter(q => !deletedIds.includes(q.id))
    .map(q => editedMap[q.id] ? { ...q, ...editedMap[q.id] } : q);

  return [...fromDefaults, ...userQuestions];
}

function loadFavorites() {
  return loadJSON(FAV_KEY, []);
}
function saveFavorites(list) {
  saveJSON(FAV_KEY, list);
}

let questions = buildQuestionList();
let favorites = loadFavorites();
let currentCategory = "Semua";
let currentQuestion = null;
let editingId = null;

// ===== TAB SWITCHING =====
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.view).classList.add("active");
    if (btn.dataset.view === "manageView") renderManageList();
  });
});

// ===== MAIN VIEW LOGIC =====
const categoriesEl = document.getElementById("categories");
const cardText = document.getElementById("cardText");
const cardTag = document.getElementById("cardTag");
const randomBtn = document.getElementById("randomBtn");
const bookmarkBtn = document.getElementById("bookmarkBtn");
const favList = document.getElementById("favList");
const emptyFav = document.getElementById("emptyFav");
const card = document.getElementById("card");

function renderCategories() {
  const all = ["Semua", ...categories];
  categoriesEl.innerHTML = "";
  all.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (cat === currentCategory ? " active" : "");
    btn.textContent = cat;
    btn.onclick = () => {
      currentCategory = cat;
      renderCategories();
    };
    categoriesEl.appendChild(btn);
  });
}

function getRandomQuestion() {
  let pool = currentCategory === "Semua" ? questions : questions.filter(q => q.cat === currentCategory);
  if (pool.length === 0) return null;
  return pool[Math.floor(Math.random() * pool.length)];
}

function showQuestion() {
  const q = getRandomQuestion();
  if (!q) {
    cardTag.textContent = "-";
    cardText.textContent = "Belum ada pertanyaan di kategori ini. Tambahin dulu di tab Kelola Pertanyaan!";
    currentQuestion = null;
    return;
  }
  currentQuestion = q;
  cardTag.textContent = q.cat;
  cardText.textContent = q.text;
  card.style.animation = "none";
  void card.offsetWidth;
  card.style.animation = "pop 0.4s ease";
  updateBookmarkState();
}

function updateBookmarkState() {
  if (!currentQuestion) { bookmarkBtn.classList.remove("active"); return; }
  const isFav = favorites.some(f => f.id === currentQuestion.id);
  bookmarkBtn.classList.toggle("active", isFav);
}

function renderFavorites() {
  favList.innerHTML = "";
  if (favorites.length === 0) {
    emptyFav.style.display = "block";
    return;
  }
  emptyFav.style.display = "none";
  favorites.forEach((f, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<span>${f.text}</span>`;
    const delBtn = document.createElement("button");
    delBtn.textContent = "✕";
    delBtn.onclick = () => {
      favorites.splice(i, 1);
      saveFavorites(favorites);
      renderFavorites();
      updateBookmarkState();
    };
    li.appendChild(delBtn);
    favList.appendChild(li);
  });
}

randomBtn.addEventListener("click", showQuestion);

bookmarkBtn.addEventListener("click", () => {
  if (!currentQuestion) return;
  const idx = favorites.findIndex(f => f.id === currentQuestion.id);
  if (idx >= 0) {
    favorites.splice(idx, 1);
  } else {
    favorites.push(currentQuestion);
  }
  saveFavorites(favorites);
  renderFavorites();
  updateBookmarkState();
});

// ===== CRUD (MANAGE) VIEW LOGIC =====
const addNewBtn = document.getElementById("addNewBtn");
const manageForm = document.getElementById("manageForm");
const formCategory = document.getElementById("formCategory");
const formText = document.getElementById("formText");
const formSaveBtn = document.getElementById("formSaveBtn");
const formCancelBtn = document.getElementById("formCancelBtn");
const manageList = document.getElementById("manageList");

function populateCategorySelect() {
  formCategory.innerHTML = "";
  categories.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat;
    opt.textContent = cat;
    formCategory.appendChild(opt);
  });
}
populateCategorySelect();

function openForm(question = null) {
  manageForm.style.display = "block";
  if (question) {
    editingId = question.id;
    formCategory.value = question.cat;
    formText.value = question.text;
  } else {
    editingId = null;
    formCategory.value = categories[0];
    formText.value = "";
  }
  formText.focus();
}
function closeForm() {
  manageForm.style.display = "none";
  editingId = null;
  formText.value = "";
}

addNewBtn.addEventListener("click", () => openForm());
formCancelBtn.addEventListener("click", closeForm);

formSaveBtn.addEventListener("click", () => {
  const text = formText.value.trim();
  const cat = formCategory.value;
  if (!text) {
    alert("Pertanyaan tidak boleh kosong ya!");
    return;
  }
  if (editingId) {
    // UPDATE
    if (editingId.startsWith("d")) {
      // ini pertanyaan bawaan -> simpan sebagai "editan", jangan sentuh defaultQuestions
      const editedMap = loadJSON(EDITED_DEFAULTS_KEY, {});
      editedMap[editingId] = { cat, text };
      saveJSON(EDITED_DEFAULTS_KEY, editedMap);
    } else {
      // ini pertanyaan buatan user -> update langsung di daftar user
      const userQuestions = loadJSON(USER_QUESTIONS_KEY, []);
      const uq = userQuestions.find(q => q.id === editingId);
      if (uq) { uq.text = text; uq.cat = cat; }
      saveJSON(USER_QUESTIONS_KEY, userQuestions);
    }
  } else {
    // CREATE -> selalu masuk daftar user, id-nya bukan format "d..."
    const userQuestions = loadJSON(USER_QUESTIONS_KEY, []);
    userQuestions.push({ id: makeId(), cat, text });
    saveJSON(USER_QUESTIONS_KEY, userQuestions);
  }
  questions = buildQuestionList();
  closeForm();
  renderManageList();
});

function renderManageList() {
  manageList.innerHTML = "";
  if (questions.length === 0) {
    manageList.innerHTML = `<li><span class="q-text">Belum ada pertanyaan. Tambahin dulu!</span></li>`;
    return;
  }
  questions.forEach(q => {
    const li = document.createElement("li");
    li.innerHTML = `
      <div class="q-text">
        <span class="q-cat">${q.cat}</span>
        ${q.text}
      </div>
      <div class="manage-actions">
        <button class="btn-edit" title="Edit">✏️</button>
        <button class="btn-del" title="Hapus">🗑️</button>
      </div>
    `;
    li.querySelector(".btn-edit").addEventListener("click", () => openForm(q));
    li.querySelector(".btn-del").addEventListener("click", () => {
      if (confirm("Yakin mau hapus pertanyaan ini?")) {
        if (q.id.startsWith("d")) {
          // pertanyaan bawaan -> tandai "dihapus", defaultQuestions di kode tetap utuh
          const deletedIds = loadJSON(DELETED_DEFAULTS_KEY, []);
          if (!deletedIds.includes(q.id)) deletedIds.push(q.id);
          saveJSON(DELETED_DEFAULTS_KEY, deletedIds);
        } else {
          // pertanyaan buatan user -> hapus beneran dari daftar user
          const userQuestions = loadJSON(USER_QUESTIONS_KEY, []);
          saveJSON(USER_QUESTIONS_KEY, userQuestions.filter(item => item.id !== q.id));
        }
        questions = buildQuestionList();
        favorites = favorites.filter(f => f.id !== q.id);
        saveFavorites(favorites);
        renderManageList();
        renderFavorites();
      }
    });
    manageList.appendChild(li);
  });
}

// ===== INIT =====
renderCategories();
renderFavorites();
