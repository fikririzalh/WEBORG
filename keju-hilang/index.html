<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#001f4f"><meta name="description" content="Pembagi peran dan angka rahasia Cheese Thief untuk satu ponsel bersama."><title>Keju Hilang! — companion meja</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23ffd730' d='M7 47 55 14v40H7Z'/%3E%3Ccircle fill='%23001f4f' cx='31' cy='42' r='4'/%3E%3Ccircle fill='%23001f4f' cx='47' cy='46' r='3'/%3E%3C/svg%3E"><style>
:root{font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;color:#001f4f;background:#f0f0f0;font-size:16px}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0%,#d8f4ff,transparent 38%),#f0f0f0}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:760px;margin:auto;padding:20px 18px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:10px;font-weight:950;font-size:1.24rem;letter-spacing:-.04em}.mark{background:#ffd730;border:3px solid #001f4f;border-radius:12px;padding:4px 8px;transform:rotate(-7deg);font-size:1.4rem}.theme{border:2px solid currentColor;border-radius:999px;background:transparent;color:inherit;padding:9px 13px;font-size:.88rem;font-weight:750}.panel{background:#fff;border:2px solid #001f4f;border-radius:25px;box-shadow:6px 6px 0 #001f4f;padding:24px;position:relative;overflow:hidden}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:.78rem;font-weight:900;color:#9c208c;margin:0 0 8px}h1{font-size:clamp(2.1rem,9vw,4rem);line-height:1.02;letter-spacing:-.065em;margin:0 0 14px}h2{font-size:clamp(1.7rem,7vw,2.6rem);line-height:1.1;letter-spacing:-.045em;margin:0 0 10px}p{line-height:1.48;margin:0 0 18px}.muted{color:#455d7c}.art{width:100%;max-height:210px;object-fit:contain;display:block;margin:-10px auto 8px}.row{display:flex;gap:10px;align-items:center}.counter{display:flex;align-items:center;gap:16px;margin:14px 0 22px}.counter strong{font-size:2rem;min-width:38px;text-align:center}.circle{height:44px;width:44px;background:#fff;border:2px solid #001f4f;border-radius:50%;font-size:1.4rem;font-weight:800}.primary,.secondary,.danger{width:100%;min-height:56px;border:2px solid #001f4f;border-radius:16px;font-weight:900;padding:12px 18px;box-shadow:3px 3px 0 #001f4f}.primary{background:#ffd730;color:#001f4f}.secondary{background:#3cb4e6;color:#001f4f}.danger{background:#fff;color:#9c208c;border-color:#9c208c;box-shadow:3px 3px 0 #9c208c}.primary:active,.secondary:active,.danger:active{box-shadow:0 0 0;transform:translate(3px,3px)}.small{min-height:44px;box-shadow:none}.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 19px}.names label{font-size:.87rem;font-weight:800}.names input{display:block;width:100%;margin-top:5px;border:2px solid #9aabc2;border-radius:12px;padding:11px 12px;background:transparent;color:inherit;outline-color:#3cb4e6}.check{display:flex;gap:10px;align-items:flex-start;background:#e5f8f1;padding:13px;border-radius:13px;margin:0 0 20px;font-size:.94rem}.check input{width:20px;height:20px;accent-color:#32b18e;flex:none}.note{font-size:.85rem;margin:15px 0 0;color:#455d7c}.steps{display:flex;gap:6px;margin:0 0 20px}.steps span{height:8px;flex:1;border-radius:99px;background:#d0d0d0}.steps .done{background:#32b18e}.steps .now{background:#ff8040}.handoff{background:#dff5ff;border:2px dashed #3cb4e6;border-radius:18px;padding:16px;margin:18px 0;text-align:center;font-weight:800}.secret{min-height:200px;background:#001f4f;color:white;border-radius:18px;padding:20px;display:grid;place-content:center;text-align:center;margin:16px 0;user-select:none}.secret .role{font-size:clamp(1.5rem,7vw,2.3rem);font-weight:950}.secret .die{font-size:2.1rem;color:#ffd730;font-weight:950;margin:8px 0}.secret .quiet{font-size:.85rem;color:#d0d0d0}.hold{background:#f05696;color:#001f4f;user-select:none;-webkit-user-select:none}.night{background:#001f4f;color:#f0f0f0}.night .panel{background:#092c5d;border-color:#3cb4e6;box-shadow:6px 6px 0 #3cb4e6}.night .muted,.night .note{color:#d0d0d0}.night .eyebrow{color:#ffd730}.night .theme{color:#fff}.targets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0}.target{border:2px solid #3cb4e6;background:#123c70;color:#fff;border-radius:16px;min-height:68px;font-weight:850;user-select:none;-webkit-user-select:none}.target.active{background:#ffd730;color:#001f4f}.peek-number{font-size:3.1rem;font-weight:950;line-height:1.1}.warning{background:#fff0d3;color:#001f4f;padding:13px;border-radius:12px;font-size:.9rem;margin:18px 0}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.footer{text-align:center;margin:22px auto;color:#455d7c;font-size:.8rem;max-width:610px}.night .footer{color:#d0d0d0}.badge{display:inline-block;background:#32b18e;color:#001f4f;border:2px solid #001f4f;border-radius:999px;padding:5px 11px;font-size:.76rem;font-weight:900;margin-bottom:15px}.hidden{display:none!important}@media(max-width:440px){.app{padding:14px 14px 38px}.panel{padding:20px;box-shadow:4px 4px 0 #001f4f}.names{gap:8px}.split{grid-template-columns:1fr}.art{max-height:150px}}[data-theme="dark"]{color:#f0f0f0;background:#00152f}[data-theme="dark"] body{background:radial-gradient(circle at 20% 0%,#173963,transparent 42%),#00152f}[data-theme="dark"] .panel{background:#0d305b;border-color:#3cb4e6;box-shadow:6px 6px 0 #3cb4e6}[data-theme="dark"] .muted,[data-theme="dark"] .note,[data-theme="dark"] .footer{color:#d0d0d0}[data-theme="dark"] .circle,[data-theme="dark"] .names input{background:#0d305b;color:#fff}[data-theme="dark"] .handoff{background:#163d68;color:#fff}[data-theme="dark"] .check{background:#163d68}[data-theme="dark"] .primary,[data-theme="dark"] .secondary{color:#001f4f}[data-theme="dark"] .danger{background:#0d305b;color:#ffb1d1}@media(prefers-reduced-motion:no-preference){.panel{animation:appear .25s ease-out}@keyframes appear{from{opacity:.6;transform:translateY(5px)}to{opacity:1;transform:none}}}
</style></head><body><main class="app"><header class="top"><div class="brand"><span class="mark" aria-hidden="true">🧀</span> KEJU HILANG!</div><button class="theme" id="themeBtn" type="button">🌙 Gelap</button></header><div id="screen"></div><footer class="footer">Companion penggemar untuk permainan fisik Cheese Thief. Audio moderator resmi digunakan terpisah. Tidak berafiliasi dengan Jolly Thinkers atau LaudoStudio.</footer></main><script>
(()=>{'use strict';const $=s=>document.querySelector(s), screen=$('#screen');let theme=localStorage.getItem('keju-theme')||'light';let state={phase:'setup',count:5,names:[],fall:false,players:[],turn:0,revealed:false,peek:null,confirm:false};function escape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function random(max){const x=new Uint32Array(1),limit=4294967296-(4294967296%max);do{crypto.getRandomValues(x)}while(x[0]>=limit);return x[0]%max}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=random(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}function die(){return random(6)+1}function setTheme(){document.documentElement.dataset.theme=theme;$('#themeBtn').textContent=theme==='dark'?'☀️ Terang':'🌙 Gelap'}$('#themeBtn').onclick=()=>{theme=theme==='dark'?'light':'dark';localStorage.setItem('keju-theme',theme);setTheme()};setTheme();function render(){document.body.classList.toggle('night',state.phase==='night');if(state.phase==='setup')return setup();if(state.phase==='deal')return deal();if(state.phase==='night')return night();return finish()}function setup(){screen.innerHTML=`<section class="panel"><img class="art" id="mouseArt" src="./mouse-cheese.webp" alt="Tikus kecil mengintip di balik keju" onerror="this.style.display='none'"><span class="badge">SATU PONSEL · 4–8 PEMAIN</span><h1>Siapa mencuri keju?</h1><p class="muted">Bagikan peran dan angka rahasia dengan mengoper ponsel bergiliran. Keju dan percakapan tetap di meja.</p><div class="eyebrow">Jumlah pemain</div><div class="counter"><button class="circle" id="minus" aria-label="Kurangi pemain" ${state.count===4?'disabled':''}>−</button><strong>${state.count}</strong><button class="circle" id="plus" aria-label="Tambah pemain" ${state.count===8?'disabled':''}>+</button></div><div class="eyebrow">Nama / nomor kursi</div><div class="names">${Array.from({length:state.count},(_,i)=>`<label>Pemain ${i+1}<input data-name="${i}" maxlength="22" placeholder="Pemain ${i+1}" value="${escape(state.names[i]||'')}"></label>`).join('')}</div>${state.count>=6?`<label class="check"><input type="checkbox" id="fall" ${state.fall?'checked':''}><span>Pakai varian <b>Fall Mouse</b> (satu pemain menggantikan Sleepyhead)</span></label>`:''}<button class="primary" id="start">Kocok & bagikan rahasia</button><p class="note">Butuh perangkat lain untuk audio moderator resmi. Aplikasi ini tidak memainkan audio.</p></section>`;function sync(){state.names=[...screen.querySelectorAll('[data-name]')].map(x=>x.value.trim())}$('#minus').onclick=()=>{sync();state.count--;render()};$('#plus').onclick=()=>{sync();state.count++;render()};if($('#fall'))$('#fall').onchange=e=>state.fall=e.target.checked;$('#start').onclick=()=>{sync();let roles=['Cheese Thief',...Array(state.count-1).fill('Sleepyhead')];if(state.count>=6&&state.fall)roles[roles.length-1]='Fall Mouse';shuffle(roles);state.players=roles.map((role,i)=>({name:state.names[i]||`Pemain ${i+1}`,role,dice:state.count===4?[die(),die()]:[die()]}));state.turn=0;state.revealed=false;state.phase='deal';render()}}function deal(){let p=state.players[state.turn],n=state.turn+1;screen.innerHTML=`<section class="panel"><div class="eyebrow">Pembagian rahasia · ${n}/${state.count}</div><div class="steps">${state.players.map((_,i)=>`<span class="${i<state.turn?'done':i===state.turn?'now':''}"></span>`).join('')}</div><h2>Giliran ${escape(p.name)}</h2><div class="handoff">Pastikan hanya ${escape(p.name)} yang melihat layar. Serahkan ponsel sekarang.</div><div class="secret" id="secret" aria-live="off"><div id="secretInner">🔒<br>Rahasia masih tertutup</div></div><button class="primary hold" id="reveal" type="button">Tekan & tahan untuk melihat</button><p class="note">Lepaskan jari untuk menutup. Lalu tekan tombol lanjut di bawah.</p><button class="secondary" id="next" ${state.revealed?'':'disabled'}>${n===state.count?'Selesai membagikan':'Tutup & serahkan berikutnya'}</button></section>`;let button=$('#reveal'),secret=$('#secretInner');function hide(){secret.innerHTML='🔒<br>Rahasia masih tertutup';state.revealed=true;$('#next').disabled=false}function show(e){e.preventDefault();button.setPointerCapture?.(e.pointerId);let detail=p.role==='Cheese Thief'?'Curi dan sembunyikan keju saat waktumu dipanggil.':p.role==='Fall Mouse'?'Ikuti aturan Sleepyhead; menang sendiri jika meraih suara terbanyak.':'Bangun saat angkamu dipanggil.';secret.innerHTML=`<div class="quiet">PERANMU</div><div class="role">${escape(p.role)}</div><div class="die">🎲 ${p.dice.join(' · ')}</div><div class="quiet">${detail}${state.count===4&&p.role==='Sleepyhead'?' Pilih salah satu angka untuk bangun. Tidak boleh mengintip.':''}</div>`}button.onpointerdown=show;button.onpointerup=hide;button.onpointercancel=hide;button.onlostpointercapture=hide;button.oncontextmenu=e=>e.preventDefault();$('#next').onclick=()=>{if(!state.revealed)return;state.revealed=false;state.turn++;if(state.turn>=state.count)state.phase='night';render()}}function night(){screen.innerHTML=`<section class="panel"><div class="eyebrow">Malam · angka tetap rahasia</div><h2>Semua tutup mata 🐭</h2><p class="muted">Ikuti audio moderator resmi. Letakkan ponsel ini di tengah meja dengan layar menghadap ke atas.</p>${state.count===4?`<div class="warning">Permainan 4 pemain: tidak ada aksi intip. Sleepyhead hanya bangun pada satu dari dua angka miliknya.</div>`:`<div class="warning">Hanya Sleepyhead yang bangun <b>sendirian</b> boleh mengintip <b>satu</b> angka pemain lain. Jangan melihat peran. Ponsel bersama tidak dapat memverifikasi siapa yang sedang bangun.</div><div class="eyebrow">Intip angka · tekan & tahan satu nama</div><div class="targets">${state.players.map((p,i)=>`<button class="target" data-target="${i}" type="button">${escape(p.name)}</button>`).join('')}</div><div class="secret" aria-live="off"><div id="peekDisplay">🔒<br>Pilih satu pemain</div></div><p class="note">Lepaskan jari untuk menutup angka. Jangan pilih dirimu sendiri. Aksi malam dilakukan tanpa bicara.</p>`}<button class="secondary" id="day">Malam selesai · mulai diskusi</button></section>`;screen.querySelectorAll('[data-target]').forEach(btn=>{let i=Number(btn.dataset.target),display=$('#peekDisplay');function hide(){btn.classList.remove('active');display.innerHTML='🔒<br>Pilih satu pemain'}btn.onpointerdown=e=>{e.preventDefault();btn.setPointerCapture?.(e.pointerId);btn.classList.add('active');display.innerHTML=`<span class="quiet">ANGKA ${escape(state.players[i].name)}</span><br><span class="peek-number">${state.players[i].dice[0]}</span>`};btn.onpointerup=hide;btn.onpointercancel=hide;btn.onlostpointercapture=hide;btn.oncontextmenu=e=>e.preventDefault()});$('#day').onclick=()=>{state.phase='day';render()}}function finish(){screen.innerHTML=`<section class="panel"><div class="eyebrow">Siang · diskusi & voting</div><h2>Siapa pencurinya?</h2><p>Diskusikan petunjuk. Semua menunjuk tersangka secara bersamaan, lalu pemain dengan suara terbanyak membuka perannya. Jika seri pada suara terbanyak, semua yang seri membuka perannya.</p><div class="warning">Follower ditentukan dalam fase malam sesuai instruksi moderator, bukan dibagikan sebagai peran awal. Jangan memperlihatkan angka atau peran sebelum waktunya.</div><button class="secondary" id="revealAll">${state.confirm?'Yakin? Buka seluruh rahasia':'Buka semua peran & angka'}</button><div id="all" class="hidden"></div><div style="height:13px"></div><button class="danger" id="again">Ronde baru</button></section>`;$('#revealAll').onclick=()=>{if(!state.confirm){state.confirm=true;$('#revealAll').textContent='Yakin? Buka seluruh rahasia';return}$('#all').classList.remove('hidden');$('#all').innerHTML=`<div class="warning">${state.players.map(p=>`<div><b>${escape(p.name)}</b>: ${escape(p.role)} · 🎲 ${p.dice.join(', ')}</div>`).join('')}</div>`;$('#revealAll').disabled=true};$('#again').onclick=()=>{state.phase='setup';state.players=[];state.confirm=false;render()}}document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.phase==='deal'){let el=$('#secretInner');if(el)el.innerHTML='🔒<br>Rahasia masih tertutup'}if(document.hidden&&state.phase==='night'){let el=$('#peekDisplay');if(el)el.innerHTML='🔒<br>Pilih satu pemain'}});render()})();
</script></body></html>
