<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MIAU! ONE NIGHT TABLE — TWO DEVICE</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <div class="logo">😼🌙</div>
      <div class="brand-copy">
        <div class="eyebrow">HP 1: DIGITAL TABLE • HP 2: NARRATOR</div>
        <h1>MIAU! ONE NIGHT TABLE</h1>
        <p>Web tidak mengatur giliran malam. Dengarkan narrator, bangun, tekan namamu, lakukan aksi.</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="themeBtn" class="icon-btn">🌙</button>
      <button id="soundBtn" class="icon-btn">🔊</button>
      <button id="guideBtn" class="secondary-btn">📖 Role Guide</button>
      <button id="manageBtn" class="secondary-btn">⚙️ CRUD</button>
    </div>
  </header>
  <main id="app"></main>
</div>

<dialog id="manageDialog" class="dialog wide">
  <form method="dialog" class="dialog-head">
    <div><div class="eyebrow">DATABASE LOKAL</div><h2>Kelola Game</h2></div>
    <button class="icon-btn">✕</button>
  </form>
  <div class="tabs">
    <button class="tab active" data-tab="players">👥 Pemain</button>
    <button class="tab" data-tab="roles">🃏 Role</button>
    <button class="tab" data-tab="data">💾 Data</button>
  </div>
  <div id="manageContent"></div>
</dialog>

<dialog id="formDialog" class="dialog">
  <form id="crudForm">
    <div class="dialog-head">
      <div><div id="formEyebrow" class="eyebrow"></div><h2 id="formTitle"></h2></div>
      <button type="button" id="formCloseBtn" class="icon-btn">✕</button>
    </div>
    <div id="formFields" class="form-grid"></div>
    <div class="dialog-actions">
      <button type="button" id="formCancelBtn" class="secondary-btn">Batal</button>
      <button class="primary-btn" type="submit">Simpan</button>
    </div>
  </form>
</dialog>

<dialog id="guideDialog" class="dialog wide">
  <form method="dialog" class="dialog-head">
    <div><div class="eyebrow">ROLE GUIDE</div><h2>Job Role</h2></div>
    <button class="icon-btn">✕</button>
  </form>
  <div id="guideContent"></div>
</dialog>

<dialog id="peekDialog" class="dialog">
  <div class="dialog-head">
    <div><div class="eyebrow">PRIVATE PEEK</div><h2 id="peekTitle">Kartu</h2></div>
    <button id="closePeekBtn" class="icon-btn">✕</button>
  </div>
  <div id="peekContent"></div>
</dialog>

<div id="toast" class="toast"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
